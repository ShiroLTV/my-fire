<!doctype html>
<html lang="ja" data-theme="kami">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>社会のしくみミニゲーム</title>

<script>
/* ===== ここからまちのデータ（文章や数字はここだけ直してください） =====
   ・ふりがな：{漢字|かんじ} と書くと、漢字の上にふりがなが出ます
   ・ゲームを足すときは、stations に駅を1つ足して file にゲームのファイル名を書きます
     （file が "" の駅は「こうじちゅう」になります）
   ・x は 0〜7（左→右）、y は 0〜5（上→下）。地図のマス目の位置です
   ・id はゲームの gameId と同じにします。id は変えないでください
   ・openAt：まちがどこまで育つと工事が終わるか（townLevels の何番目か。0＝はらっぱ、1＝村、2＝町、3＝市）
*/
const SITE_DATA = {
  title: "{社会|しゃかい}のしくみ ミニゲーム",
  lead: "ゲームでことばを{覚|おぼ}えるほど、まちが{育|そだ}っていくよ。",
  defaultTownName: "まんまる",
  seasons: ["{春|はる}", "{夏|なつ}", "{秋|あき}", "{冬|ふゆ}"],

  // 覚えたことばの数で、まちの呼び名が変わる
  townLevels: [
    { minWords: 0,  suffix: "はらっぱ" },
    { minWords: 1,  suffix: "{村|むら}" },
    { minWords: 3,  suffix: "{町|まち}" },
    { minWords: 6,  suffix: "{市|し}" },
    { minWords: 12, suffix: "{大都市|だいとし}" },
    { minWords: 30, suffix: "{未来都市|みらいとし}" },
    { minWords: 100, suffix: "{世界一|せかいいち}のまち" }
  ],

  // 人口がこの数をこえると、お祝いが出る（最後の数のあとは、10000人ごとに出る）
  peopleMilestones: [50, 100, 300, 500, 1000, 3000, 5000, 10000],

  // ことばのおさらいで、正解したときにふえる人口
  peoplePerReview: 5,

  // ことばのおさらいの「まちがいの選択肢」に使うことば
  extraWords: ["{一期一会|いちごいちえ}", "{十人十色|じゅうにんといろ}", "{七転|ななころ}び{八起|やお}き", "{石|いし}の{上|うえ}にも{三年|さんねん}", "{急|いそ}がば{回|まわ}れ", "{百聞|ひゃくぶん}は{一見|いっけん}にしかず"],

  // 意味がにていることばの仲間。同じ仲間は、おさらいで同じ問題の選択肢にならばない
  // （図書館のことばの仲間は library-game.html の same に書いてある。名前が同じなら同じ仲間）
  sameGroups: {
    youjin: ["備えあれば憂いなし", "転ばぬ先の杖", "用心に越したことはない", "念には念を入れよ", "石橋を叩いて渡る", "君子危うきに近寄らず", "勝って兜の緒を締めよ", "段取り八分", "天災は忘れた頃にやってくる", "用意周到", "油断大敵"],
    tsuzukeru: ["塵も積もれば山となる", "雨垂れ石を穿つ", "継続は力なり", "千里の道も一歩から", "七転び八起き", "石の上にも三年", "七転八起"],
    kyouryoku: ["共存共栄", "持ちつ持たれつ", "一致団結", "和をもって貴しとなす", "三人寄れば文殊の知恵", "二人三脚", "一心同体"],
    toki: ["時は金なり", "光陰矢の如し"],
    kane: ["先立つものは金", "無い袖は振れない"],
    kuusou: ["捕らぬ狸の皮算用", "絵に描いた餅"],
    jitsu: ["名を捨てて実を取る", "花より団子"],
    fuku: ["災い転じて福となす", "怪我の功名", "雨降って地固まる"],
    iroiro: ["十人十色", "三者三様", "千差万別"],
    ittoku: ["一石二鳥", "一挙両得"]
  },

  stations: [
    { id: "shop",     name: "まんまるおにぎり{堂|どう}", area: "しょうてんがい", icon: "🍙", file: "shop-game.html", openAt: 0, x: 3, y: 2 },
    { id: "rice",     name: "{田|た}んぼ",               area: "たんぼ・はたけ", icon: "🌾", file: "rice-game.html", openAt: 1, x: 1, y: 1 },
    { id: "inn",      name: "{民宿|みんしゅく}",         area: "かんこう",       icon: "🏠", file: "inn-game.html",  openAt: 2, x: 6, y: 1 },
    { id: "cityhall", name: "{市役所|しやくしょ}",       area: "しやくしょ",     icon: "🏛️", file: "city-game.html", openAt: 3, x: 5, y: 4 },
    { id: "bank",     name: "{銀行|ぎんこう}",           area: "おかね",         icon: "🏦", file: "bank-game.html", openAt: 4, x: 1, y: 4 },
    { id: "library",  name: "{図書館|としょかん}",       area: "ことば",         icon: "📚", file: "library-game.html", openAt: 1, x: 4, y: 0.4 },
    { id: "infra",    name: "インフラ{管理|かんり}センター", area: "インフラ",   icon: "🔧", file: "infrastructure-game.html", openAt: 2, x: 6.1, y: 4.4 }
  ],

  // どの駅とどの駅を線路でつなぐか（id で書く）
  rails: [
    ["rice", "shop"],
    ["shop", "inn"],
    ["shop", "cityhall"],
    ["inn", "cityhall"],
    ["shop", "bank"],
    ["bank", "cityhall"],
    ["library", "shop"],
    ["library", "inn"],
    ["cityhall", "infra"]
  ]
};
/* ===== ここまでまちのデータ ===== */
</script>

<style>
  /* ---- 共通の色（テーマごとに使う比重を変える） ---- */
  :root {
    --kinari: #FBF6EC;
    --sumi: #3A2E25;
    --ninjin: #D9622B;
    --anzu: #EBA98A;
    --tamago: #FFF1D2;
    --yamabuki: #E8B54A;
    --wakaba: #C9E2A0;
    --mizuasagi: #A9D6CC;
    --kinako: #DDB98F;
    --nezumi: #C7C9C6;
    --kogecha: #6B4A2E;
    --sora: #3E7BD6;
    --sakura: #F08AA0;
    /* 上の色から作った、少し濃い色・うすい色 */
    --wakaba-deep: #9CC46E;
    --mori: #6F9F4C;
    --mizu-deep: #7FBFB2;
    --kinako-deep: #C49A6A;
    --nezumi-deep: #A3A6A2;
    --paper: #FFFDF7;
    --skin: #F1C9A5;
    --ninjin-deep: #9E4119;
    --muted: #6E6155;
    --line: #E3D6C2;
    --good: #2F8A4C;
    --bad: #B5453A;
    --on-main: #FFFFFF;
    /* 字体：外から読み込まず、端末に入っている字体を使う */
    --font-title: "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro", "UD Digi Kyokasho NK-B", "UD デジタル 教科書体 NK-B", "BIZ UDPGothic", sans-serif;
    --font-sub: "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro", "BIZ UDPGothic", "Yu Gothic", sans-serif;
    --font-text: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --kinari: #2A231C;
      --sumi: #F3EBDD;
      --tamago: #4A3D25;
      --yamabuki: #C9963A;
      --anzu: #B97B60;
      --wakaba: #4E6537;
      --wakaba-deep: #5E7A42;
      --mori: #3B5528;
      --mizuasagi: #3F6A62;
      --mizu-deep: #4F7F75;
      --kinako: #7A6043;
      --kinako-deep: #5E4831;
      --nezumi: #5E605D;
      --nezumi-deep: #474946;
      --kogecha: #C9A27A;
      --sora: #6B9BE8;
      --sakura: #C8687D;
      --paper: #352C23;
      --skin: #D9AE8A;
      --ninjin: #F07F45;
      --ninjin-deep: #8A3712;
      --muted: #C2B5A3;
      --line: #4A3E32;
      --good: #6CC78A;
      --bad: #EE7D72;
      --on-main: #1F1B17;
    }
  }

  /* ---- テーマ：きりがみ ---- */
  [data-theme="kami"] {
    --bg: var(--kinari);
    --text: var(--sumi);
    --shade: #D9C8AE;          /* 紙の重なりの影（ぼかさず、ずらして塗る） */
    --shade-map: rgba(58, 46, 37, .28);
  }
  @media (prefers-color-scheme: dark) {
    [data-theme="kami"] { --shade: #17120D; --shade-map: rgba(0, 0, 0, .45); }
  }
  /* つみき・えんぴつ・ぬの・はんこ の見た目は、このファイルのいちばん下の <style>（テーマ別の見た目）に書いてある */

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg);
    /* 生成りの紙のせんい */
    background-image: radial-gradient(rgba(107, 74, 46, .06) 1px, transparent 1.2px);
    background-size: 7px 7px;
    color: var(--text);
    font-family: var(--font-text);
    font-size: 17px;
    line-height: 1.85;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  a, button { touch-action: manipulation; }
  main { max-width: 1180px; margin: 0 auto; padding: 12px 16px 48px; }
  body.no-ruby rt { display: none; }
  rt { font-size: 0.55em; }
  h1, h2, h3 { font-family: var(--font-sub); }
  .muted { color: var(--muted); }
  .error { color: var(--bad); }
  .hidden { display: none; }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* ---- いちばん上（ゲーム集の名前・ふりがな・設定） ---- */
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .logo {
    font-family: var(--font-sub); font-weight: bold; font-size: 15px;
    background: var(--paper); padding: 2px 12px 3px; border-radius: 3px 8px 4px 6px;
    transform: rotate(-2deg); box-shadow: 3px 3px 0 var(--shade);
  }
  .tools { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .ruby-toggle {
    position: relative; min-height: 48px; padding: 0 14px 0 24px; white-space: nowrap;
    font-family: var(--font-sub); font-size: 15px; font-weight: bold; color: var(--text); cursor: pointer;
    background: var(--paper); border: 2px solid var(--kinako-deep); border-radius: 4px 12px 12px 4px;
    box-shadow: 2px 3px 0 var(--shade); transform: rotate(1.5deg);
  }
  .ruby-toggle::before { /* 札のひもを通す穴 */
    content: ""; position: absolute; left: 8px; top: 50%; width: 8px; height: 8px; margin-top: -4px;
    border-radius: 50%; background: var(--bg); border: 2px solid var(--kinako-deep);
  }
  .icon-btn {
    width: 48px; height: 48px; padding: 9px; cursor: pointer; color: var(--sumi);
    background: var(--kinako); border: 0; border-radius: 10px 14px 12px 8px;
    box-shadow: 3px 3px 0 var(--kinako-deep);
  }
  .icon-btn svg { width: 100%; height: 100%; display: block; }

  /* ---- まちの名前と数字 ---- */
  .town-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 22px; margin: 16px 0 4px; }
  .title-sign {
    position: relative; background: var(--paper); padding: 4px 18px 6px 16px;
    border-radius: 6px 3px 8px 4px; transform: rotate(-1.2deg); box-shadow: 5px 5px 0 var(--kinako-deep);
  }
  /* まちの名前：ぷにっとした丸い題字（端末の丸い字体＋白い丸いふちどり＋ずらした影）
     ふちどりは、字のまわりに影を12方向に重ねて作る（角がとがらず、丸くなる） */
  .title-sign h1 {
    font-family: "Arial Rounded MT Bold", var(--font-title); font-weight: 900;
    font-size: clamp(30px, 7.8vw, 44px); line-height: 1.5; margin: 0; letter-spacing: .03em;
    color: var(--ninjin);
    text-shadow:
      .1em 0 0 #fff, .087em .05em 0 #fff, .05em .087em 0 #fff, 0 .1em 0 #fff, -.05em .087em 0 #fff, -.087em .05em 0 #fff,
      -.1em 0 0 #fff, -.087em -.05em 0 #fff, -.05em -.087em 0 #fff, 0 -.1em 0 #fff, .05em -.087em 0 #fff, .087em -.05em 0 #fff,
      .1em .1em 0 var(--kogecha), .05em .187em 0 var(--kogecha), 0 .2em 0 var(--kogecha), -.05em .187em 0 var(--kogecha),
      -.1em .1em 0 var(--kogecha), .087em .15em 0 var(--kogecha), -.087em .15em 0 var(--kogecha);
  }
  .title-sign h1 rt { color: var(--text); text-shadow: none; font-weight: bold; }
  .title-sign .pop { margin: -4px 0 0; font-family: var(--font-title); font-size: 15px; }
  .title-sign .pop b { font-size: 24px; color: var(--ninjin); margin: 0 2px; }
  .stats { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 15px; }
  /* ふりがなの前後にすき間が入らないよう、flex ではなく ふつうの文として並べる */
  .stats li { display: inline-block; }
  .stats b { font-family: var(--font-title); font-size: 21px; color: var(--ninjin); }
  .stats svg { width: 22px; height: 22px; vertical-align: -4px; margin-right: 4px; }
  .hint { color: var(--muted); font-size: 15px; margin: 12px 0 10px; }

  /* まちが育った瞬間の、光の粒 */
  .spark {
    position: absolute; left: var(--x); top: var(--y); width: 13px; height: 13px; pointer-events: none;
    background: var(--yamabuki); opacity: 0;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    animation: spark .9s var(--d) ease-out 3 both;
  }
  .spark:nth-child(3n) { background: var(--sakura); }
  .spark:nth-child(3n+1) { background: var(--mizu-deep); }
  @keyframes spark {
    0% { transform: translate(0, 0) scale(0); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.1); opacity: 0; }
  }

  /* ---- お知らせ（育った・工事が終わった・人口） ---- */
  .banner {
    display: flex; align-items: center; gap: 10px; margin: 8px 0; padding: 6px 14px;
    background: var(--tamago); border-left: 7px solid var(--yamabuki); border-radius: 2px 8px 8px 2px;
    font-weight: bold; box-shadow: 3px 3px 0 var(--shade);
  }
  .banner:nth-of-type(2n) { transform: rotate(.4deg); }
  .banner svg { flex: none; width: 28px; height: 28px; }

  /* ---- 地図と、横の列 ---- */
  .layout { display: grid; gap: 18px; margin-top: 8px; }
  @media (min-width: 960px) {
    .layout { grid-template-columns: minmax(0, 1.75fr) minmax(300px, 1fr); align-items: start; gap: 28px; }
    .side { padding-top: 18px; }
  }
  .map-wrap { position: relative; padding-top: 16px; }
  .theme-sign {
    position: absolute; top: 0; left: 18px; z-index: 6;
    background: var(--kinako); color: var(--sumi); padding: 1px 14px 3px;
    font-family: var(--font-sub); font-weight: bold; font-size: 14px;
    border-radius: 3px; transform: rotate(-4deg); box-shadow: 3px 3px 0 var(--kogecha);
    outline: 1.5px dashed var(--paper); outline-offset: -5px;
  }
  .map {
    position: relative; width: 100%; aspect-ratio: 4 / 3; container-type: inline-size;
    background: var(--wakaba); border-radius: 10px 16px 12px 18px; overflow: hidden;
    box-shadow: 6px 6px 0 var(--kinako-deep);
  }
  .map > svg.ground { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map .tint { position: absolute; inset: 0; pointer-events: none; }
  .map.season-0 .tint { background: rgba(240, 138, 160, .10); }
  .map.season-1 .tint { background: rgba(232, 181, 74, .10); }
  .map.season-2 .tint { background: rgba(196, 154, 106, .25); }
  .map.season-3 .tint { background: rgba(255, 253, 247, .28); }

  /* 地図の上の絵（紙を切りぬいて貼ったように、ずらした影をつける） */
  .map svg.pic { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(2px 2px 0 var(--shade-map)); }
  .station {
    position: absolute; transform: translate(-50%, -58%); z-index: 3;
    display: flex; flex-direction: column; align-items: center;
    color: var(--text); text-decoration: none; cursor: pointer;
  }
  .station .picwrap { position: relative; width: max(54px, 13.5cqw); height: max(54px, 13.5cqw); }
  /* ---- 押したときの反応（マウスをのせる・押す・指でタップ） ---- */
  .station .picwrap, .station .sign, .deco > svg { transition: transform .15s ease-out; }
  @media (hover: hover) {
    .station:not(.off):hover .picwrap { transform: translateY(-5px); }
    .station:not(.off):hover .sign { transform: rotate(var(--tilt, 0deg)) scale(1.08); }
    .deco:not(.season):hover > svg { transform: scale(1.15); }
    .btn-main:hover, .btn:hover:not(:disabled), .btn-sub:hover:not(:disabled) { translate: 0 -2px; }
  }
  .station:not(.off):active .picwrap { transform: translateY(2px) scale(.96); }
  .deco:active > svg { transform: scale(.9); }
  .btn-sub:active:not(:disabled) { translate: 2px 2px; }
  /* 駅を押したら、ぴょんとはねてからゲームへ移る */
  .station.pressing .picwrap { animation: press-hop .28s ease-out both; }
  @keyframes press-hop { 0% { transform: none; } 45% { transform: translateY(-16%) scale(1.06); } 100% { transform: translateY(0) scale(.97); } }
  /* 工事中の駅を押したら、ぶるっとゆれる */
  .station.off.shake .picwrap { animation: press-shake .4s ease-out; }
  @keyframes press-shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6%); } 40% { transform: translateX(5%); } 60% { transform: translateX(-3%); } 80% { transform: translateX(2%); } }
  /* 飾りを押したら、ぷるっとゆれる */
  .deco.wiggle > svg { animation: press-wiggle .45s ease-out; }
  @keyframes press-wiggle { 0%, 100% { transform: none; } 25% { transform: rotate(-12deg) scale(1.1); } 50% { transform: rotate(9deg) scale(1.05); } 75% { transform: rotate(-4deg); } }
  .station .flag { position: absolute; top: -10%; right: -12%; width: 38%; height: 38%; }
  .station .sign {
    margin-top: -3px; padding: 0 8px; white-space: nowrap;
    font-family: var(--font-sub); font-weight: bold; font-size: max(11px, 2.5cqw); line-height: 1.75;
    background: var(--paper); border: 1.5px solid var(--kinako-deep); border-radius: 2px 5px 3px 4px;
    transform: rotate(var(--tilt, 0deg)); box-shadow: 2px 2px 0 var(--shade-map);
  }
  .station .sign.sg-b { background: var(--tamago); border-color: var(--yamabuki); }
  .station .sign.sg-c { background: var(--kinako); border-color: var(--kogecha); }
  .station.off { cursor: default; }
  .station.off .sign { background: var(--nezumi); border-style: dashed; border-color: var(--nezumi-deep); font-weight: normal; }
  /* 工事が終わった瞬間：工事中の紙がめくれて、建物が出てくる */
  .peel { position: absolute; inset: 0; transform-origin: 100% 0; animation: peel 1.3s .5s ease-in both; }
  @keyframes peel {
    0% { transform: none; opacity: 1; }
    30% { transform: rotate(5deg) skewY(4deg); opacity: 1; }
    100% { transform: rotate(80deg) translate(15%, -30%) skewY(10deg); opacity: 0; }
  }

  .deco {
    position: absolute; transform: translate(-50%, -50%); z-index: 2;
    width: max(26px, 6.6cqw); height: max(26px, 6.6cqw); padding: 0;
    background: none; border: 0; cursor: pointer;
    animation: pop .6s ease-out both;
  }
  .deco::after { content: ""; position: absolute; inset: -6px; } /* 指で押せる範囲を広げる */
  .deco.person { width: max(16px, 4cqw); height: max(22px, 5.4cqw); }
  .deco.season { width: max(16px, 4cqw); height: max(16px, 4cqw); cursor: default; pointer-events: none; z-index: 1; }
  .deco:focus-visible, .station:focus-visible { outline: 3px solid var(--sora); outline-offset: 2px; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(.2); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .train { position: absolute; top: 93.3%; left: 0; width: max(56px, 14cqw); height: max(22px, 5.6cqw); transform: translateY(-50%) scaleX(-1); animation: run 14s linear infinite; z-index: 2; }
  @keyframes run { from { left: -16%; } to { left: 104%; } }
  .map-tag {
    position: absolute; z-index: 8; max-width: 62%; padding: 3px 12px 4px 20px;
    font-size: 13px; line-height: 1.65; color: var(--sumi);
    background: var(--tamago); border: 1.5px solid var(--kogecha); border-radius: 2px 6px 4px 3px;
    transform: translate(-50%, calc(-100% - 12px)) rotate(-2deg); box-shadow: 2px 2px 0 var(--kogecha);
  }
  .map-tag::before { content: ""; position: absolute; left: 7px; top: 9px; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--kogecha); }
  .lead { color: var(--muted); font-size: 15px; margin: 14px 0 0; }

  /* ---- 横の列（つぎの工事・おつかい・ボタン） ---- */
  .next-sign {

  /* 施設の名前はワッペン */

  /* 絵：ふちに縫い目 */
  [data-theme="nuno"] { --pic-stroke: var(--stitch); --pic-stroke-w: 1.1; --pic-dash: 2.2 1.8; }
  /* 地面：フェルトをぬいつけたように */
  [data-theme="nuno"] .g-l1,
  [data-theme="nuno"] .g-l2,
  [data-theme="nuno"] .g-patch { stroke: var(--stitch); stroke-width: 2.5; stroke-dasharray: 7 6; }
  /* 完成の演出：ワッペンが置かれ、縫い目が1周走って縫いつけられる */
  [data-theme="nuno"] .peel { animation: theme-off .3s .3s both; }
  [data-theme="nuno"] .station.opening .picwrap > .pic { animation: nuno-place .7s .5s both; }
  [data-theme="nuno"] .station.opening .picwrap::after {
    content: ""; position: absolute; inset: -8%; pointer-events: none;
    border: 2.5px dashed var(--ninjin); border-radius: 46% 42% 48% 40%;
    animation: nuno-sew 1.2s 1.1s both;
  }
  @keyframes nuno-place {
    0% { transform: translateY(-30%) scale(1.25) rotate(-10deg); opacity: 0; }
    60% { transform: scale(.96) rotate(2deg); opacity: 1; }
    100% { transform: none; }
  }
  @keyframes nuno-sew {
    0% { opacity: 0; transform: rotate(-200deg) scale(.85); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: none; }
  }

  /* ---------- はんこ：スタンプで刷った町。にんじん・そら・すみの3色だけ。版を少しずらす ---------- */
  [data-theme="hanko"] {
    --bg: var(--kinari);
    --text: var(--sumi);
    --wakaba: #C9D9F2; --wakaba-deep: #9DB8E6; --mori: #3E7BD6;
    --mizuasagi: #C9D9F2; --mizu-deep: #3E7BD6;
    --kinako: #F3C9B2; --kinako-deep: #D9622B;
    --tamago: #FDF0E6; --yamabuki: #D9622B; --anzu: #F3C9B2; --sakura: #D9622B;
    --kogecha: #3A2E25; --nezumi: #E2DCD2; --nezumi-deep: #6E6155; --skin: #F3C9B2;
    --shade: transparent;
    --shade-map: rgba(62, 123, 214, .75);
  }
  @media (prefers-color-scheme: dark) {
    [data-theme="hanko"] {
      --wakaba: #2C3E5C; --wakaba-deep: #3A5585; --mori: #6B9BE8;
      --mizuasagi: #2C3E5C; --mizu-deep: #6B9BE8;
      --kinako: #5A3322; --kinako-deep: #F07F45;
      --tamago: #3A2A20; --yamabuki: #F07F45; --anzu: #5A3322; --sakura: #F07F45;
      --kogecha: #C9A27A; --nezumi: #4A443D; --nezumi-deep: #C2B5A3; --skin: #D9AE8A;
      --shade-map: rgba(107, 155, 232, .6);
    }
  }
  [data-theme="hanko"] body { background-image: radial-gradient(rgba(58, 46, 37, .05) 1px, transparent 1.3px); background-size: 9px 9px; }
  [data-theme="hanko"] .card,
  [data-theme="hanko"] .banner,
  [data-theme="hanko"] .logo { border: 2.5px solid var(--ninjin); border-radius: 3px; box-shadow: 2px 1.5px 0 var(--sora); }
  [data-theme="hanko"] .title-sign { border: 4px double var(--ninjin); border-radius: 4px; box-shadow: 2px 1.5px 0 var(--sora); }
  [data-theme="hanko"] .next-sign { border-color: var(--sora); box-shadow: none; }
  /* おつかいは切手のようなギザギザのふち */
  [data-theme="hanko"] .daily { border: 3px dotted var(--sora); border-radius: 2px; box-shadow: 2px 1.5px 0 var(--ninjin); }
  [data-theme="hanko"] .btn-main,
  [data-theme="hanko"] .btn { border-radius: 4px; box-shadow: 2.5px 2px 0 var(--sora); }
  [data-theme="hanko"] .btn-main:active,
  [data-theme="hanko"] .btn:active { box-shadow: 1px 1px 0 var(--sora); }
  [data-theme="hanko"] .btn-sub { background: var(--paper); border: 2px solid var(--sora); border-radius: 3px; box-shadow: 2px 1.5px 0 var(--ninjin); }
  [data-theme="hanko"] .ruby-toggle,
  [data-theme="hanko"] .icon-btn { box-shadow: 2px 1.5px 0 var(--sora); }
  [data-theme="hanko"] .theme-sign { background: var(--paper); border: 2px solid var(--ninjin); outline: 0; box-shadow: 2px 1.5px 0 var(--sora); }
  [data-theme="hanko"] .map { border-radius: 4px; box-shadow: 4px 3px 0 var(--sora); }
  [data-theme="hanko"] .map svg.pic { filter: url(#f-ink) drop-shadow(1.5px 1px 0 var(--shade-map)); }
  /* 施設の名前は、はんこの四角い枠 */
  [data-theme="hanko"] .station .sign { background: var(--paper); border: 2px solid var(--sora); border-radius: 2px; box-shadow: 1.5px 1px 0 var(--ninjin); }
  [data-theme="hanko"] .station .sign.sg-b { border-color: var(--ninjin); box-shadow: 1.5px 1px 0 var(--sora); }
  [data-theme="hanko"] .station .sign.sg-c { border-color: var(--sumi); }
  [data-theme="hanko"] .g-base { fill: var(--kinari); }
  [data-theme="hanko"] .g-l1 { fill: var(--wakaba); }
  [data-theme="hanko"] .g-l2 { fill: var(--wakaba-deep); }
  [data-theme="hanko"] .g-shade { fill: var(--sora); opacity: .3; }
  /* 完成の演出：スタンプがポンと押され、インクが少しにじむ */
  [data-theme="hanko"] .peel { animation: theme-off .2s .45s both; }
  [data-theme="hanko"] .station.opening .picwrap > .pic { animation: hanko-stamp .5s .5s cubic-bezier(.3, 1.6, .6, 1) both; }
  [data-theme="hanko"] .station.opening .picwrap::after {
    content: ""; position: absolute; inset: 10%; z-index: -1; pointer-events: none;
    border-radius: 50%; background: var(--ninjin);
    animation: hanko-ink .8s .85s both;
  }
  @keyframes hanko-stamp {
    0% { transform: scale(1.9); opacity: 0; }
    60% { transform: scale(.92); opacity: 1; }
    100% { transform: none; }
  }
  @keyframes hanko-ink {
    0% { opacity: .35; transform: scale(.4); }
    100% { opacity: 0; transform: scale(1.5); }
  }

  /* 絵（<symbol>）の中の形に、テーマごとのふちどりをつける。
     絵は <use> でコピーして使うので、「[data-theme] の中の○○」という指定は絵の中まで届かない。
     そのかわり、CSS変数（--pic-○○）は絵の中まで受けつがれるので、テーマでは変数だけを決める。
     :where() は、ほかの指定（.edge など）より弱くするため */
  :where(path, circle, rect, ellipse)[class*="c-"] {
    stroke: var(--pic-stroke, none); stroke-width: var(--pic-stroke-w, 0);
    stroke-dasharray: var(--pic-dash, none); fill-opacity: var(--pic-fill-op, 1); stroke-linejoin: round;
  }

  /* 駅を押したときの感じを、テーマの素材に合わせて変える */
  [data-theme="tsumiki"] .station.pressing .picwrap { animation-name: press-sink; }   /* 積み木が沈む */
  [data-theme="hanko"] .station.pressing .picwrap { animation-name: press-stamp; }    /* ポンと押す */
  [data-theme="nuno"] .station.pressing .picwrap { animation-name: press-squish; }    /* ふにゃっとへこむ */
  @keyframes press-sink { 0% { transform: none; } 50% { transform: translateY(10%) scaleY(.9); } 100% { transform: translateY(4%); } }
  @keyframes press-stamp { 0% { transform: none; } 40% { transform: scale(.82); } 70% { transform: scale(1.06); } 100% { transform: none; } }
  @keyframes press-squish { 0% { transform: none; } 50% { transform: scale(1.12, .84); } 100% { transform: scale(.98, 1.02); } }

  /* 4つのテーマで共通：工事中の絵を消す */
  @keyframes theme-off { to { opacity: 0; transform: translateY(15%); } }
  @media (prefers-reduced-motion: reduce) {
    .station.opening .picwrap > .pic { animation: none; }
    .station.opening .picwrap::after { display: none; }
    .station .picwrap, .station .sign, .deco > svg { transition: none; }
    .station.pressing .picwrap, .station.off.shake .picwrap, .deco.wiggle > svg { animation: none; }
  }
</style>

<script>
(function () {
  const app = document.getElementById("app");
  const rubyToggle = document.getElementById("rubyToggle");
  const STORE_KEY = "machi-game-v1";
  const THEME_KEY = "machi-theme-v1"; // テーマは、まちの記録とは別に保存する
  const COLS = 8, ROWS = 6;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function rich(s) {
    return escapeHtml(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
  }
  function plain(s) { return String(s || "").replace(/\{([^{}|]+)\|[^{}|]+\}/g, "$1"); }
  // SVG の絵を使う（id は上の <symbol> の名前）
  function pic(id, cls, style) {
    return '<svg class="' + (cls || "pic") + '"' + (style ? ' style="' + style + '"' : "") + ' aria-hidden="true" focusable="false"><use href="#' + id + '"/></svg>';
  }
  rubyToggle.addEventListener("click", () => {
    const off = document.body.classList.toggle("no-ruby");
    rubyToggle.textContent = off ? "ふりがな：なし" : "ふりがな：あり";
  });

  if (typeof SITE_DATA === "undefined" || !Array.isArray(SITE_DATA.stations) || !Array.isArray(SITE_DATA.townLevels)) {
    app.innerHTML = '<p class="error">まちのデータの書き方に誤りがあります。「"」「,」「{ }」「[ ]」が消えていないか確認してください。</p>';
    return;
  }
  const D = SITE_DATA;
  const SEASONS = D.seasons || ["春", "夏", "秋", "冬"];
  document.getElementById("siteTitle").innerHTML = rich(D.title);

  // ---- 記録（この端末のブラウザの中だけに保存） ----
  let memoryStore = null; // 保存できない環境のための予備
  function loadStore() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY)) || {};
      s.words = s.words || {};
      s.catalog = s.catalog || {};
      s.people = s.people || 0;
      s.turn = s.turn || 0;
      return s;
    } catch (e) { return memoryStore || { words: {}, catalog: {}, people: 0, turn: 0 }; }
  }
  function saveStore(s) {
    memoryStore = s;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* 保存できない環境 */ }
  }
  function today() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function dayNumber() {
    const d = new Date();
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  // ---- まちのテーマ ----
  // ready: false のテーマは、見本だけ見せて「じゅんびちゅう」にする
  const THEMES = [
    // name には「町」を入れない（まちの名前「〇〇町」とまぎれるため）
    { id: "kami",    name: "きりがみ", ready: true },
    { id: "tsumiki", name: "つみき",   ready: true },
    { id: "enpitsu", name: "えんぴつ", ready: true },
    { id: "nuno",    name: "ぬの",     ready: true },
    { id: "hanko",   name: "はんこ",   ready: true }
  ];
  let memoryTheme = "";
  function loadTheme() {
    try { return localStorage.getItem(THEME_KEY) || memoryTheme; } catch (e) { return memoryTheme; }
  }
  function saveTheme(id) {
    memoryTheme = id;
    try { localStorage.setItem(THEME_KEY, id); } catch (e) { /* 保存できない環境 */ }
  }
  function themeOf(id) { return THEMES.find(t => t.id === id && t.ready) || THEMES[0]; }
  function applyTheme(id) { document.documentElement.setAttribute("data-theme", themeOf(id).id); }

  // ---- まちの育ち ----
  const levels = D.townLevels.slice().sort((a, b) => a.minWords - b.minWords);
  function levelIndexOf(n) {
    let idx = 0;
    levels.forEach((l, i) => { if (n >= l.minWords) idx = i; });
    return idx;
  }
  // 人口のお祝いの区切り（リストのあとは10000人ごと）
  function milestoneBelow(people) {
    const ms = (D.peopleMilestones || []).slice().sort((a, b) => a - b);
    let hit = 0;
    ms.forEach(m => { if (people >= m) hit = m; });
    const last = ms[ms.length - 1] || 0;
    if (people >= last + 10000) hit = Math.floor((people - last) / 10000) * 10000 + last;
    return hit;
  }

  // 駅の絵（id ごとに形を変える。知らない id の駅は、ふつうの建物の絵）
  const STATION_PICS = { shop: "st-shop", rice: "st-rice", inn: "st-inn", cityhall: "st-cityhall", bank: "st-bank", library: "st-library", infra: "st-infra" };
  // 区画の色（area ごと）
  const AREA_FILLS = { "しょうてんがい": "var(--tamago)", "たんぼ・はたけ": "var(--wakaba-deep)", "かんこう": "var(--mizuasagi)", "しやくしょ": "var(--nezumi)", "おかね": "var(--kinako)", "ことば": "var(--anzu)", "インフラ": "var(--mizu-deep)" };
  const AREA_FALLBACK = ["var(--sakura)", "var(--mizu-deep)", "var(--yamabuki)"];
  const SIGN_TILTS = [-3, 2, -1.5, 3, -2.5, 1.5];

  // 育つと現れる飾り（x, y はマス目の位置。level は townLevels の何番目から出るか。name はタップしたときの札）
  const DECOS = [
    { level: 1, kind: "d-tree",   name: "{木|き}",   x: 0.4, y: 3.1 }, { level: 1, kind: "d-pine", name: "{木|き}", x: 2.5, y: 0.4 },
    { level: 1, kind: "d-sprout", name: "{芽|め}",   x: 0.4, y: 0.5 }, { level: 1, kind: "d-field", name: "{畑|はたけ}", x: 2.2, y: 2.0 },
    { level: 1, kind: "d-pine",   name: "{木|き}",   x: 7.5, y: 3.0 },
    { level: 2, kind: "d-house",  name: "{家|いえ}", x: 2.6, y: 3.5 }, { level: 2, kind: "d-house2", name: "{家|いえ}", x: 2.7, y: 1.6 },
    { level: 2, kind: "d-lamp",   name: "{灯|あか}り", x: 4.6, y: 2.4 }, { level: 2, kind: "d-flower", name: "{花|はな}だん", x: 3.9, y: 3.0 },
    { level: 2, kind: "d-tree",   name: "{木|き}",   x: 7.4, y: 1.0 },
    { level: 3, kind: "d-bldg",   name: "ビル",      x: 7.4, y: 4.0 }, { level: 3, kind: "d-store", name: "お{店|みせ}", x: 3.1, y: 4.5 },
    { level: 3, kind: "d-car",    name: "{車|くるま}", x: 6.2, y: 3.0 }, { level: 3, kind: "d-tower", name: "{時計台|とけいだい}", x: 2.7, y: 5.0 },
    { level: 4, kind: "d-fire",   name: "{花火|はなび}", x: 7.0, y: 0.25 }, { level: 4, kind: "d-bldg", name: "ビル", x: 6.8, y: 2.5, c1: "var(--sakura)" },
    { level: 4, kind: "d-wheel",  name: "{観覧車|かんらんしゃ}", x: 1.4, y: 2.6 },
    { level: 5, kind: "d-rocket", name: "ロケット",  x: 6.0, y: 0.35 }, { level: 5, kind: "d-airship", name: "{飛行船|ひこうせん}", x: 3.2, y: 1.2 },
    { level: 6, kind: "d-rainbow", name: "にじ",     x: 1.6, y: 0.25 }, { level: 6, kind: "d-fountain", name: "{噴水|ふんすい}", x: 4.9, y: 3.3 }
  ];
  // 季節の飾り
  const SEASON_DECOS = [["s-sakura", "s-sakura", "s-sakura"], ["s-sun", "s-sun", "s-sun"], ["s-leaf", "s-leaf", "s-leaf"], ["s-snow", "s-flake", "s-flake"]];
  const SEASON_MARKS = ["s-sakura", "s-sun", "s-leaf", "s-snow"];
  const SEASON_SPOTS = [{ x: 0.3, y: 1.9 }, { x: 3.3, y: 0.3 }, { x: 7.6, y: 5.0 }];
  // 人口がふえると現れる、まちの人たち（服と髪の色を1人ずつ変える）
  const PEOPLE_LOOKS = [
    ["var(--sora)", "var(--sumi)"], ["var(--sakura)", "var(--kogecha)"], ["var(--mori)", "var(--sumi)"],
    ["var(--yamabuki)", "var(--kogecha)"], ["var(--mizu-deep)", "var(--sumi)"], ["var(--anzu)", "var(--kogecha)"],
    ["var(--kinako-deep)", "var(--sumi)"], ["var(--nezumi-deep)", "var(--kogecha)"], ["var(--wakaba-deep)", "var(--sumi)"], ["var(--kogecha)", "var(--sumi)"]
  ];
  const PEOPLE_SPOTS = [
    { x: 1.9, y: 3.1 }, { x: 2.9, y: 1.0 }, { x: 4.1, y: 2.0 }, { x: 3.7, y: 4.3 }, { x: 6.6, y: 3.6 },
    { x: 3.6, y: 3.6 }, { x: 7.3, y: 2.0 }, { x: 4.2, y: 4.8 }, { x: 0.3, y: 3.8 }, { x: 5.6, y: 1.5 }
  ];
  const PEOPLE_STEP = 50; // 50人ごとに1人ふえる

  function pct(v, total) { return (v / total * 100) + "%"; }

  // ---- 地図の地面（色紙を重ねた山・畑・道） ----
  const HILL_BACK = "M0 0H800V92C760 108 720 84 680 100C630 76 570 84 530 106C490 84 430 88 390 108C340 82 280 86 240 106C190 80 130 86 90 108C60 96 30 94 0 104Z";
  const HILL_FRONT = "M0 0H800V48C750 20 700 26 660 52C610 16 545 22 505 54C455 22 390 26 350 56C300 22 235 20 195 54C145 22 75 26 0 50Z";
  const FIELD_PATCHES = [{ x: 470, y: 330, w: 110, h: 46, r: -6 }, { x: 18, y: 250, w: 84, h: 40, r: 8 }, { x: 660, y: 560, w: 100, h: 30, r: -4 }];
  const TUFTS = [[130, 330], [300, 420], [420, 190], [600, 260], [740, 470], [80, 520], [520, 520], [250, 240]];
  // 区画の形（駅ごとに少しずつちがう、ゆがんだ丸）
  function blobPath(cx, cy, rx, ry, seed) {
    const n = 9, pts = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2, k = 0.82 + 0.22 * Math.abs(Math.sin(seed * 2.3 + i * 1.7));
      pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
    }
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    let d = "M" + mid(pts[n - 1], pts[0]).map(v => v.toFixed(1)).join(" ");
    for (let i = 0; i < n; i++) {
      const m = mid(pts[i], pts[(i + 1) % n]);
      d += "Q" + pts[i].map(v => v.toFixed(1)).join(" ") + " " + m.map(v => v.toFixed(1)).join(" ");
    }
    return d + "Z";
  }
  function groundSvg(li, byId) {
    let g = '<svg class="ground" viewBox="0 0 800 600" preserveAspectRatio="none" aria-hidden="true">' +
      '<defs><filter id="paperEdge" x="-5%" y="-5%" width="110%" height="110%">' +
        '<feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="7"/>' +
        '<feDisplacementMap in="SourceGraphic" scale="5"/></filter></defs>' +
      '<rect class="g-base" width="800" height="600"/>' +
      '<g filter="url(#paperEdge)">' +
        '<path class="g-shade" transform="translate(5 6)" d="' + HILL_BACK + '"/><path class="g-l1" d="' + HILL_BACK + '"/>' +
        '<path class="g-shade" transform="translate(5 6)" d="' + HILL_FRONT + '"/><path class="g-l2" d="' + HILL_FRONT + '"/>';
    FIELD_PATCHES.forEach(f => {
      const t = ' transform="rotate(' + f.r + " " + (f.x + f.w / 2) + " " + (f.y + f.h / 2) + ')"';
      g += '<rect class="g-shade" x="' + (f.x + 4) + '" y="' + (f.y + 4) + '" width="' + f.w + '" height="' + f.h + '"' + t + "/>" +
        '<rect class="g-l1" x="' + f.x + '" y="' + f.y + '" width="' + f.w + '" height="' + f.h + '"' + t + "/>" +
        '<path class="g-stitch" d="M' + (f.x + 8) + " " + (f.y + f.h / 2) + "h" + (f.w - 16) + '"' + t + "/>";
    });
    // 駅のまわりの区画
    D.stations.forEach((st, i) => {
      const cx = (st.x + 0.5) * 100, cy = (st.y + 0.5) * 100;
      const fill = AREA_FILLS[st.area] || AREA_FALLBACK[i % AREA_FALLBACK.length];
      const d = blobPath(cx, cy + 6, 92, 74, i + 1);
      g += '<path class="g-shade" transform="translate(4 5)" d="' + d + '"/><path class="g-patch" style="fill:' + fill + '" d="' + d + '"/>';
    });
    g += "</g>";
    // 道（切った紙の帯。まん中の白線は縫い目）
    const roads = [];
    (D.rails || []).forEach(r => {
      const a = byId[r[0]], b = byId[r[1]];
      if (a && b) roads.push([(a.x + 0.5) * 100, (a.y + 0.5) * 100, (b.x + 0.5) * 100, (b.y + 0.5) * 100]);
    });
    roads.push([-20, 560, 820, 560]); // まちの外へつづく道
    const line = (r, cls, dx) => '<line class="' + cls + '" x1="' + (r[0] + dx) + '" y1="' + (r[1] + dx) + '" x2="' + (r[2] + dx) + '" y2="' + (r[3] + dx) + '"/>';
    roads.forEach(r => { g += line(r, "g-road-shade", 4); });
    roads.forEach(r => { g += line(r, "g-road", 0); });
    roads.forEach(r => { g += line(r, "g-stitch", 0); });
    // 草（まちが育つと、ふえる）
    TUFTS.slice(0, li >= 2 ? TUFTS.length : 4).forEach(([x, y]) => {
      g += '<path class="g-tuft" d="M' + (x - 10) + " " + y + "l5-10 5 10 5-12 5 12" + '"/>';
    });
    return g + "</svg>";
  }

  // まちが育った瞬間に、タイトルのまわりではじける光の粒
  function sparkles() {
    let h = "";
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2;
      h += '<span class="spark" aria-hidden="true" style="--x:' + (50 + Math.cos(a) * 42).toFixed(0) + "%;--y:" + (50 + Math.sin(a) * 40).toFixed(0) +
        "%;--dx:" + (Math.cos(a) * 26).toFixed(0) + "px;--dy:" + (Math.sin(a) * 22).toFixed(0) + "px;--d:" + (i % 4 * 0.12).toFixed(2) + 's"></span>';
    }
    return h;
  }

  let mapTags = []; // 地図の飾りをタップしたときに出す札の文

  function render() {
    const s = loadStore();
    const learned = Object.keys(s.words).length;
    const li = levelIndexOf(learned);
    const lv = levels[li];
    const next = levels[li + 1];
    const townName = s.townName || D.defaultTownName || "まんまる";
    const si = s.turn % 4;
    const chosenTheme = loadTheme();

    // 育った知らせ・人口のお祝い
    let banner = "";
    const grewNow = typeof s.lastLevel === "number" && li > s.lastLevel;
    const openedNow = {};
    if (grewNow) {
      banner += '<div class="banner">' + pic("i-spark", "") + "<span>" + rich("まちが「") + escapeHtml(townName) + rich(lv.suffix) + rich("」に{育|そだ}った！") + "</span></div>";
      D.stations.forEach(st => {
        const at = st.openAt || 0;
        if (st.file && at > s.lastLevel && at <= li) {
          openedNow[st.id] = true;
          banner += '<div class="banner">' + pic("i-flag", "") + "<span>" + rich(st.name) + rich("の{工事|こうじ}が{終|お}わった！ {遊|あそ}べるようになったよ。") + "</span></div>";
        }
      });
    }
    const mile = milestoneBelow(s.people);
    if (typeof s.lastPeople === "number" && mile > 0 && milestoneBelow(s.lastPeople) < mile) {
      banner += '<div class="banner">' + pic("p-person", "", "--cloth:var(--sakura)") + "<span>" + rich("{人口|じんこう}が") + mile.toLocaleString("ja-JP") + rich("{人|にん}をこえた！") + "</span></div>";
    }
    if (s.lastLevel !== li || s.lastPeople !== s.people) { s.lastLevel = li; s.lastPeople = s.people; saveStore(s); }

    // 駅ごとに覚えたことばがあるか
    const learnedByGame = {};
    Object.values(s.words).forEach(w => { learnedByGame[w.gameId] = (learnedByGame[w.gameId] || 0) + 1; });
    const byId = {};
    D.stations.forEach(st => { byId[st.id] = st; });

    // 地図：飾り（育ち・季節・人）。育ったものは押すと札が出る
    mapTags = [];
    const pos = (x, y) => "left:" + pct(x, COLS) + ";top:" + pct(y, ROWS);
    let decos = "";
    DECOS.forEach((d, i) => {
      if (li < d.level) return;
      const lvName = escapeHtml(townName) + rich(levels[d.level].suffix);
      mapTags.push(rich("まちが「") + lvName + rich("」になって ふえた") + rich(d.name) + rich("（ことば" + levels[d.level].minWords + "こ）"));
      decos += '<button class="deco" type="button" data-tag="' + (mapTags.length - 1) + '" aria-label="' + escapeHtml(plain(d.name)) + '" style="' + pos(d.x, d.y) + ";animation-delay:" + (i * 0.04) + 's">' +
        pic(d.kind, "pic", d.c1 ? "--c1:" + d.c1 : "") + "</button>";
    });
    SEASON_SPOTS.forEach((p, i) => {
      decos += '<span class="deco season" style="' + pos(p.x, p.y) + ";animation-delay:" + (0.3 + i * 0.05) + 's">' + pic(SEASON_DECOS[si][i]) + "</span>";
    });
    const peopleCount = Math.min(PEOPLE_SPOTS.length, Math.floor(s.people / PEOPLE_STEP));
    for (let i = 0; i < peopleCount; i++) {
      const look = PEOPLE_LOOKS[i % PEOPLE_LOOKS.length];
      mapTags.push(rich("{人口|じんこう}が" + (i + 1) * PEOPLE_STEP + "{人|にん}をこえて ひっこしてきた{人|ひと}"));
      decos += '<button class="deco person" type="button" data-tag="' + (mapTags.length - 1) + '" aria-label="まちの人" style="' + pos(PEOPLE_SPOTS[i].x, PEOPLE_SPOTS[i].y) + ";animation-delay:" + (0.5 + i * 0.05) + 's">' +
        pic("p-person", "pic", "--cloth:" + look[0] + ";--hair:" + look[1]) + "</button>";
    }
    if (li >= 4) decos += '<span class="train" aria-hidden="true">' + pic("t-train") + "</span>";

    // 地図：駅（まちが育つと工事が終わる）
    const isOpen = st => st.file && li >= (st.openAt || 0);
    let stations = "";
    D.stations.forEach((st, i) => {
      const style = 'style="' + pos(st.x + 0.5, st.y + 0.5) + ";--tilt:" + SIGN_TILTS[i % SIGN_TILTS.length] + 'deg"';
      const signCls = "sign " + ["sg-a", "sg-b", "sg-c"][i % 3];
      if (isOpen(st)) {
        const flag = learnedByGame[st.id] ? pic("i-flag", "flag") : "";
        const peel = openedNow[st.id] ? '<span class="peel" aria-hidden="true">' + pic("st-off") + "</span>" : "";
        stations += '<a class="station' + (openedNow[st.id] ? " opening" : "") + '" href="' + escapeHtml(st.file) + '" ' + style + ">" +
          '<span class="picwrap">' + pic(STATION_PICS[st.id] || "st-generic") + flag + peel + "</span>" +
          '<span class="' + signCls + '">' + rich(st.name) + "</span></a>";
      } else {
        stations += '<span class="station off" ' + style + ">" +
          '<span class="picwrap">' + pic("st-off") + "</span>" +
          '<span class="' + signCls + '">' + rich(st.name) + "（こうじちゅう）</span></span>";
      }
    });

    // 次に工事が終わる駅の知らせ
    const nextOpen = D.stations.filter(st => st.file && !isOpen(st)).sort((a, b) => (a.openAt || 0) - (b.openAt || 0))[0];
    let construction = "";
    if (nextOpen && levels[nextOpen.openAt]) {
      const need = levels[nextOpen.openAt].minWords - learned;
      construction = '<div class="next-sign">' +
        '<p class="label">' + rich("つぎに {工事|こうじ}が {終|お}わる ばしょ") + "</p>" +
        '<p class="name">' + pic("st-off", "") + rich(nextOpen.name) + "</p>" +
        '<p class="txt">' + rich("まちが「") + escapeHtml(townName) + rich(levels[nextOpen.openAt].suffix) + rich("」になると{完成|かんせい}（あと") + "<b>" + need + "</b>" + rich("こ）") + "</p></div>";
    }

    // 今日のおつかい（日付で駅が決まる）。この画面の主ボタンは「おつかいに行く」だけ
    const open = D.stations.filter(isOpen);
    let daily = "";
    if (open.length) {
      const st = open[dayNumber() % open.length];
      const done = s.dailyDone === today();
      daily =
        '<div class="daily"><h2>' + pic("i-bag", "") + rich("{今日|きょう}のおつかい") + "</h2>" +
        (done
          ? '<p class="done">' + rich("{今日|きょう}のおつかいは、もうやったよ。また{明日|あした}！") + "</p>"
          : "<p>" + rich(st.name) + rich("で、{今日|きょう}だけの1{問|もん}にちょうせん。3{点|てん}で{人口|じんこう}がたくさんふえるよ。") + "</p>" +
            '<a class="btn-main" href="' + escapeHtml(st.file) + '?mode=daily">' + pic("i-bag", "") + rich("おつかいに{行|い}く") + "</a>") +
        "</div>";
    }

    // ことば図鑑
    let zukan = '<div class="card zukan hidden" id="zukan"><h2>' + rich("ことば{図鑑|ずかん}") + "</h2>";
    open.forEach(st => {
      const cat = s.catalog[st.id];
      zukan += "<h3>" + rich(st.name) + "</h3>";
      if (!cat || !cat.words.length) {
        zukan += '<p class="muted">' + rich("ここで{遊|あそ}ぶと、{覚|おぼ}えられることばが{出|で}てくるよ。") + "</p>";
        return;
      }
      // 覚えたことばだけを並べ、まだのものは数で知らせる（図書館は150語あるため）
      const got = cat.words.filter(w => s.words[plain(w.word)]);
      zukan += '<p class="muted" style="margin:0 0 6px">' + rich("{覚|おぼ}えた：") + got.length + " / " + cat.words.length + "</p>";
      got.forEach(w => {
        zukan += '<div class="phrase"><div class="word">' + rich(w.word) + "</div><div>" + rich(w.meaning) + "</div>" +
          (w.note ? '<div class="note"><span class="note-tag">ちがい</span>' + rich(w.note) + "</div>" : "") + "</div>";
      });
      if (got.length < cat.words.length) {
        zukan += '<div class="phrase locked"><div class="word">？？？ × ' + (cat.words.length - got.length) + "</div><div>" +
          rich(st.id === "library" || st.id === "infra" ? "{正解|せいかい}すると{覚|おぼ}えられるよ" : "3{点|てん}をとると{覚|おぼ}えられるよ") + "</div></div>";
      }
    });
    zukan += "</div>";

    const hint = next
      ? rich("あと") + "<b>" + (next.minWords - learned) + "</b>" + rich("こで「") + escapeHtml(townName) + rich(next.suffix) + rich("」に{育|そだ}つよ")
      : rich("いちばん{大|おお}きなまちに{育|そだ}ったよ！ {人口|じんこう}はまだまだふえるよ。");
    const themeSign = chosenTheme ? '<div class="theme-sign">' + rich("{見|み}た{目|め}：") + rich(themeOf(chosenTheme).name) + "</div>" : "";

    app.innerHTML =
      '<section class="town-head">' +
        '<div class="title-sign">' +
          "<h1>" + escapeHtml(townName) + rich(lv.suffix) + "</h1>" +
          '<p class="pop">' + rich("{人口|じんこう}") + "<b>" + s.people.toLocaleString("ja-JP") + "</b>" + rich("{人|にん}") + "</p>" +
          (grewNow ? sparkles() : "") +
        "</div>" +
        '<ul class="stats">' +
          "<li>" + pic(SEASON_MARKS[si], "") + rich(SEASONS[si]) + "</li>" +
          "<li>" + pic("i-book", "") + rich("{覚|おぼ}えたことば") + " <b>" + learned + "</b> " + rich("こ") + "</li>" +
        "</ul>" +
      "</section>" +
      '<p class="hint">' + hint + "</p>" +
      banner +
      '<div class="layout">' +
        '<div class="map-col">' +
          '<div class="map-wrap">' + themeSign +
            '<div class="map season-' + si + '" id="map">' + groundSvg(li, byId) + '<div class="tint"></div>' + decos + stations +
              '<div class="map-tag" id="mapTag" hidden></div></div>' +
          "</div>" +
          '<p class="lead">' + rich(D.lead || "") + rich(" ゲームを1{回|かい}{遊|あそ}ぶと、{季節|きせつ}が{進|すす}むよ。{育|そだ}ったものを{押|お}すと、ふえたわけがわかるよ。") + "</p>" +
        "</div>" +
        '<div class="side">' +
          construction +
          daily +
          '<div class="actions">' +
            '<button class="btn-sub s1" id="reviewBtn" type="button"' + (learned ? "" : " disabled") + ">" + pic("i-review", "") +
              "<span>" + rich(learned ? "ことばのおさらい（{正解|せいかい}で{人口|じんこう}アップ）" : "ことばのおさらい（ことばを{覚|おぼ}えるとできるよ）") + "</span></button>" +
            '<button class="btn-sub s2" id="zukanBtn" type="button" aria-expanded="false" aria-controls="zukan">' + pic("i-book", "") +
              "<span>" + rich("ことば{図鑑|ずかん}を{見|み}る") + "</span></button>" +
          "</div>" +
          zukan +
        "</div>" +
      "</div>";

    document.getElementById("zukanBtn").onclick = () => {
      const z = document.getElementById("zukan");
      const show = z.classList.toggle("hidden") === false;
      const btn = document.getElementById("zukanBtn");
      btn.setAttribute("aria-expanded", String(show));
      btn.querySelector("span").innerHTML = rich(show ? "ことば{図鑑|ずかん}をとじる" : "ことば{図鑑|ずかん}を{見|み}る");
    };
    if (learned) document.getElementById("reviewBtn").onclick = startReview;
    setupMapTags();
  }

  // 動きを減らす設定になっているか
  function reduceMotion() { return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; }
  // 動きのクラスをつけ直して、押すたびに動きを最初から見せる
  function replay(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth; // 一度消したことをブラウザに気づかせる
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 500);
  }
  // スマホ（iPhone など）でも、指で押している間の見た目（:active）が出るようにする
  document.addEventListener("touchstart", () => {}, { passive: true });
  // 「戻る」でこのページにもどったとき、はねた途中の駅が残らないようにする
  window.addEventListener("pageshow", () => {
    document.querySelectorAll(".station.pressing").forEach(el => el.classList.remove("pressing"));
  });

  // 地図の飾りを押すと、ふえたわけを書いた札を出す（ほかの所を押すと消える）
  function setupMapTags() {
    const map = document.getElementById("map");
    const tag = document.getElementById("mapTag");
    map.addEventListener("click", e => {
      // 駅：ぴょんとはねてからゲームへ（新しいタブで開くときや、動きを減らす設定のときは、すぐ移る）
      const st = e.target.closest(".station");
      if (st) {
        if (st.classList.contains("off")) { replay(st, "shake"); return; }
        if (reduceMotion() || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
        e.preventDefault();
        st.classList.add("pressing");
        setTimeout(() => { location.href = st.getAttribute("href"); }, 280);
        return;
      }
      const btn = e.target.closest(".deco[data-tag]");
      if (!btn) { tag.hidden = true; return; }
      replay(btn, "wiggle");
      if (!tag.hidden && tag.dataset.for === btn.dataset.tag) { tag.hidden = true; return; }
      tag.innerHTML = mapTags[Number(btn.dataset.tag)];
      tag.dataset.for = btn.dataset.tag;
      tag.hidden = false;
      // 札が地図からはみ出さないように、札の幅をはかって位置を決める
      const half = tag.offsetWidth / map.clientWidth * 50 + 2;
      tag.style.left = Math.min(100 - half, Math.max(half, parseFloat(btn.style.left))) + "%";
      tag.style.top = Math.max(16, parseFloat(btn.style.top)) + "%";
    });
  }

  // ---- 上に重ねる画面 ----
  function openOverlay(html, onEscape) {
    const ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML = html;
    document.body.appendChild(ov);
    if (onEscape) ov.addEventListener("keydown", e => { if (e.key === "Escape") onEscape(); });
    return ov;
  }

  const THUMB_TILTS = [-1.5, 1, -0.5, 1.5, -1];
  function openThemePicker(first) {
    const cur = loadTheme() || "kami";
    const close = () => { ov.remove(); document.getElementById("settingsBtn").focus(); };
    const ov = openOverlay(
      '<div class="card wide" role="dialog" aria-modal="true" aria-labelledby="themeTitle">' +
        '<h2 id="themeTitle">' + rich("まちの {見|み}た{目|め}を えらぼう") + "</h2>" +
        '<p class="muted" style="margin:0">' + rich("あとから「まちの{設定|せってい}」で かえられるよ。{人口|じんこう}や ことばは そのまま。") + "</p>" +
        '<div class="themes">' +
          THEMES.map((t, i) =>
            '<button class="theme-opt" type="button" data-theme-id="' + t.id + '" style="--r:' + THUMB_TILTS[i] + 'deg"' +
              (t.ready ? ' aria-pressed="' + (t.id === cur) + '"' : " disabled") + ">" +
              '<svg viewBox="0 0 120 90" aria-hidden="true">' + THUMBS[t.id] + "</svg>" +
              '<span class="name">' + rich(t.name) + "</span>" +
              (t.ready ? "" : '<span class="soon">じゅんびちゅう</span>') +
            "</button>").join("") +
        "</div>" +
        (first ? "" : '<button class="text-btn" id="themeClose" type="button">とじる</button>') +
      "</div>",
      first ? null : () => close()
    );
    ov.querySelectorAll(".theme-opt:not(:disabled)").forEach(b => {
      b.onclick = () => {
        saveTheme(b.dataset.themeId);
        applyTheme(b.dataset.themeId);
        ov.remove();
        render();
        if (first && !loadStore().townName) askName("");
      };
    });
    if (!first) document.getElementById("themeClose").onclick = close;
    ov.querySelector(".theme-opt:not(:disabled)").focus();
  }

  // ---- まちの設定（テーマ・名前・最初から） ----
  function openSettings() {
    const close = () => { ov.remove(); document.getElementById("settingsBtn").focus(); };
    const ov = openOverlay(
      '<div class="card" role="dialog" aria-modal="true" aria-labelledby="setTitle">' +
        '<h2 id="setTitle">' + rich("まちの{設定|せってい}") + "</h2>" +
        '<div class="set-list">' +
          '<button class="btn-sub s1" id="setTheme" type="button">' + rich("まちの{見|み}た{目|め}をえらぶ") + "</button>" +
          '<button class="btn-sub s2" id="setName" type="button">' + rich("まちの{名前|なまえ}を{変|か}える") + "</button>" +
          '<button class="btn-sub s3" id="setReset" type="button">' + rich("まちを{最初|さいしょ}からにする") + "</button>" +
        "</div>" +
        '<button class="text-btn" id="setClose" type="button">とじる</button>' +
      "</div>",
      () => close()
    );
    document.getElementById("setTheme").onclick = () => { ov.remove(); openThemePicker(false); };
    document.getElementById("setName").onclick = () => { ov.remove(); askName(loadStore().townName || ""); };
    document.getElementById("setReset").onclick = () => {
      if (!confirm("まちを最初からにしますか？\n覚えたことば・人口・季節・まちの名前が消えます。")) return;
      ov.remove();
      const cur = loadStore();
      saveStore({ words: {}, catalog: cur.catalog, people: 0, turn: 0 });
      render();
      askName("");
    };
    document.getElementById("setClose").onclick = close;
    document.getElementById("setTheme").focus();
  }
  document.getElementById("settingsBtn").onclick = openSettings;

  // ---- ことばのおさらい（意味を見て、ことばを選ぶ。3問） ----
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function startReview() {
    const s = loadStore();
    const learnedList = Object.values(s.words);
    // まちがいの選択肢に使うことば（各ゲームと図書館のストック、extraWords）
    const pool = {}, meaningOf = {}, sameOf = {};
    const addWord = (word, meaning, same) => {
      const k = plain(word);
      pool[k] = word;
      if (meaning) meaningOf[k] = meaning;
      if (same) sameOf[k] = same;
    };
    learnedList.forEach(w => addWord(w.word, w.meaning));
    Object.values(s.catalog).forEach(c => (c.words || []).forEach(w => addWord(w.word, w.meaning, w.same)));
    (D.extraWords || []).forEach(w => addWord(w, ""));
    Object.keys(D.sameGroups || {}).forEach(g => D.sameGroups[g].forEach(k => { sameOf[k] = g; }));
    // 正解と同じ意味・同じ仲間のことばは、まちがいの選択肢にしない
    const okAsWrong = (k, target) => k !== plain(target.word) && meaningOf[k] !== target.meaning &&
      !(sameOf[k] && sameOf[k] === sameOf[plain(target.word)]);
    const quiz = shuffle(learnedList).slice(0, 3);
    let i = 0, gained = 0;

    const ov = openOverlay("");
    const close = () => { ov.remove(); render(); };

    function showQ() {
      const w = quiz[i];
      // 出題の向きを毎回くじで決める：意味→ことば、または ことば→意味
      const reverse = Math.random() < 0.5;
      let choices, rightKey, title, shown;
      if (!reverse) {
        const others = shuffle(Object.keys(pool).filter(k => okAsWrong(k, w))).slice(0, 2).map(k => pool[k]);
        choices = shuffle([w.word].concat(others));
        rightKey = plain(w.word);
        title = rich("この{意味|いみ}のことばは？");
        shown = '<p style="font-weight:bold">「' + rich(w.meaning) + "」</p>";
      } else {
        const others = shuffle(Object.keys(pool).filter(k => meaningOf[k] && okAsWrong(k, w))).slice(0, 2).map(k => meaningOf[k]);
        choices = shuffle([w.meaning].concat(others));
        rightKey = plain(w.meaning);
        title = rich("このことばの{意味|いみ}は？");
        shown = '<p style="font-weight:bold;font-size:22px">' + rich(w.word) + "</p>";
      }
      ov.innerHTML =
        '<div class="card" role="dialog" aria-modal="true" aria-labelledby="rvTitle">' +
          '<p class="muted" style="margin:0">' + rich("ことばのおさらい") + " " + (i + 1) + " / " + quiz.length + "</p>" +
          '<h2 id="rvTitle">' + title + "</h2>" +
          shown +
          "<div>" + choices.map((c, k) => '<button class="choice" type="button" data-k="' + k + '">' + rich(c) + "</button>").join("") + "</div>" +
          '<div id="rvFeedback"></div>' +
        "</div>";
      ov.querySelectorAll(".choice").forEach(btn => {
        btn.onclick = () => {
          const pick = choices[Number(btn.dataset.k)];
          const ok = plain(pick) === rightKey;
          ov.querySelectorAll(".choice").forEach((b, k) => {
            b.disabled = true;
            if (plain(choices[k]) === rightKey) b.classList.add("right");
          });
          if (!ok) btn.classList.add("wrong");
          if (ok) {
            gained += D.peoplePerReview || 0;
            const cur = loadStore();
            cur.people += D.peoplePerReview || 0;
            saveStore(cur);
          }
          const last = i === quiz.length - 1;
          document.getElementById("rvFeedback").innerHTML =
            "<p>" + (ok ? rich("{正解|せいかい}！ {人口|じんこう}が" + (D.peoplePerReview || 0) + "{人|にん}ふえた。") : rich("おしい！ {正解|せいかい}は「") + rich(w.word) + rich("」。")) + "</p>" +
            '<button class="btn" id="rvNext" type="button">' + rich(last ? "おわる" : "つぎへ") + "</button>";
          document.getElementById("rvNext").onclick = () => { if (last) { showEnd(); } else { i++; showQ(); } };
        };
      });
    }
    function showEnd() {
      ov.innerHTML =
        '<div class="card" role="dialog" aria-modal="true">' +
          "<h2>" + rich("おさらいおしまい！") + "</h2>" +
          "<p>" + rich("ふえた{人口|じんこう}：") + "<b>" + gained + "</b>" + rich("{人|にん}") + "</p>" +
          '<button class="btn" id="rvClose" type="button">' + rich("まちに{戻|もど}る") + "</button>" +
        "</div>";
      document.getElementById("rvClose").onclick = close;
    }
    showQ();
  }

  // ---- まちの名前をつける ----
  function askName(current) {
    const ov = openOverlay(
      '<div class="card" role="dialog" aria-modal="true" aria-labelledby="nameTitle">' +
        '<h2 id="nameTitle" style="margin-top:0">' + rich("まちの{名前|なまえ}をつけよう") + "</h2>" +
        '<input id="nameInput" type="text" maxlength="8" autocomplete="off" placeholder="れい：さくら" value="' + escapeHtml(current) + '">' +
        '<p class="muted" style="font-size:15px;margin:0 0 4px">' + rich("8{文字|もじ}まで。{自分|じぶん}や{友|とも}だちの{名前|なまえ}は{入|い}れないでね。") + "</p>" +
        '<p class="muted" style="font-size:15px;margin:0 0 14px">' + rich("{何|なに}も{入|い}れないと「") + escapeHtml(D.defaultTownName || "まんまる") + rich("」になるよ。") + "</p>" +
        '<button class="btn" id="nameOk" type="button">' + rich("{決|き}める") + "</button>" +
      "</div>"
    );
    const input = document.getElementById("nameInput");
    input.focus();
    const done = () => {
      const s = loadStore();
      s.townName = input.value.trim().slice(0, 8) || D.defaultTownName || "まんまる";
      saveStore(s);
      ov.remove();
      render();
    };
    document.getElementById("nameOk").onclick = done;
    input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) done(); });
  }

  // ---- はじめ ----
  const savedTheme = loadTheme();
  applyTheme(savedTheme);
  render();
  if (!savedTheme) openThemePicker(true);       // 初めて：テーマ → まちの名前の順
  else if (!loadStore().townName) askName("");
})();
</script>
</body>
