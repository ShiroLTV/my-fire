  .error { border-color: var(--bad); color: var(--bad); }
  /* はばのせまいスマホでは、余白を少しへらして文字の場所を広くする */
  @media (max-width: 360px) {
    main { padding: 12px 12px 40px; }
    .card { padding: 16px; }
    .phrase { padding: 10px 12px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <a href="index.html">← まちへ{戻|もど}る</a>
    <button class="ruby-toggle" id="rubyToggle" type="button">ふりがな：あり</button>
  </div>
  <div id="app"></div>
</main>

<script>
(function () {
  const app = document.getElementById("app");
  const rubyToggle = document.getElementById("rubyToggle");
  const SEASON_ICONS = ["🌸", "☀️", "🍁", "⛄"];
  const SEASONS = ["{春|はる}", "{夏|なつ}", "{秋|あき}", "{冬|ふゆ}"];

  // ---- ふりがな ----
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function rich(s) {
    return escapeHtml(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
  }
  function plain(s) { return String(s || "").replace(/\{([^{}|]+)\|[^{}|]+\}/g, "$1"); }
  function reading(s) { return String(s || "").replace(/\{([^{}|]+)\|([^{}|]+)\}/g, "$2"); }
  function setupRubyToggle() {
    document.querySelectorAll(".topbar a").forEach(a => { a.innerHTML = rich(a.textContent); });
    rubyToggle.addEventListener("click", () => {
      const off = document.body.classList.toggle("no-ruby");
      rubyToggle.textContent = off ? "ふりがな：なし" : "ふりがな：あり";
    });
  }
  setupRubyToggle();

  // ---- 乱数 ----
  function seededRandom(seedText) {
    let h = 2166136261;
    for (let i = 0; i < seedText.length; i++) { h ^= seedText.charCodeAt(i); h = Math.imul(h, 16777619); }
    return function () {
      h += 0x6D2B79F5;
      let t = h;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function today() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  // ---- 問題づくり ----
  // まちがいの選択肢に使えることば（同じ種類で、意味がにている仲間ではないもの）
  function distractorPool(entry) {
    return STOCK.filter(e => e.t === entry.t && e !== entry && !(entry.same && e.same === entry.same));
  }
  // 四字熟語の□に入れる、まちがいの字の候補
  function yojiBlankCandidates(entry, pos) {
    const chars = Array.from(plain(entry.w));
    const correct = chars[pos];
    const allYoji = new Set(STOCK.filter(e => e.t === "yoji").map(e => plain(e.w)));
    const set = new Set();
    STOCK.forEach(e => {
      if (e.t !== "yoji" || e === entry) return;
      const c = Array.from(plain(e.w))[pos];
      if (!c || c === correct) return;
      const replaced = chars.slice(); replaced[pos] = c;
      if (allYoji.has(replaced.join(""))) return; // 別の四字熟語になってしまう字は使わない
      set.add(c);
    });
    return Array.from(set);
  }
  // ことばを、ふりがなのまとまりに分ける（{漢字|かんじ} は1まとまり、ふりがなのない字は1字ずつ）
  function rubyParts(w) {
    const parts = [];
    String(w).replace(/\{([^{}|]+)\|([^{}|]+)\}|([^{}])/g, (m, base, read, ch) => {
      parts.push(base ? { base, read } : { base: ch, read: ch });
      return m;
    });
    return parts;
  }
  // isBlank(まとまり, 番号) が true のまとまりを、ことばでも読み方でも□にする
  function blankParts(entry, isBlank) {
    const parts = rubyParts(entry.w);
    return {
      shown: parts.map((p, i) => isBlank(p, i) ? "□".repeat(Array.from(p.base).length) : p.base).join(""),
      reading: parts.map((p, i) => isBlank(p, i) ? "□" : p.read).join("")
    };
  }
  // 四字熟語の□問題：どの字を□にするかは毎回くじ
  function yojiBlank(entry, rnd) {
    const chars = Array.from(plain(entry.w));
    const pos = Math.floor(rnd() * chars.length);
    const correct = chars[pos];
    const wrong = shuffle(yojiBlankCandidates(entry, pos), rnd).slice(0, 2);
    // 四字熟語はふりがなを1字ずつ書くので、まとまりの番号＝字の位置
    const b = blankParts(entry, (p, i) => i === pos);
    return { shown: b.shown, reading: b.reading, correct, wrong };
  }
  // ことわざの□問題：fill に書いた字を使う（同じ字が2回あれば、どちらも□にする）
  function kotowazaBlank(entry) {
    const correct = entry.fill[0];
    const b = blankParts(entry, p => p.base === correct);
    return { shown: b.shown, reading: b.reading, correct, wrong: entry.fill.slice(1, 3) };
  }
  function blankText(entry, rnd) {
    return entry.t === "yoji" ? yojiBlank(entry, rnd) : kotowazaBlank(entry);
  }
  function questionTypes(entry) {
    const types = ["m2w", "w2m"];
    if (entry.t === "yoji" || (entry.fill && entry.fill.length === 3)) types.push("blank");
    return types;
  }
  function choiceList(correct, wrong) {
    return [{ label: correct, points: 3 }].concat(wrong.map(label => ({ label, points: 0 })));
  }
  // 問題の種類ごとの、問題文と選択肢のつくり方
  const QUESTION_BUILDERS = {
    // 意味 → ことば
    m2w(entry, others, typeName) {
      return {
        promptHtml: "<p>" + rich("つぎの{意味|いみ}の" + typeName + "は？") + "</p><p><b>「" + escapeHtml(entry.m) + "」</b></p>",
        choices: choiceList(entry.w, others.map(e => e.w))
      };
    },
    // ことば → 意味
    w2m(entry, others, typeName) {
      return {
        promptHtml: "<p>" + rich("つぎの" + typeName + "の{意味|いみ}は？") + '</p><p class="blank" style="font-size:24px">' + rich(entry.w) + "</p>",
        choices: choiceList(entry.m, others.map(e => e.m))
      };
    },
    // □に入る漢字
    blank(entry, others, typeName, rnd) {
      const b = blankText(entry, rnd);
      return {
        promptHtml: "<p>" + rich("□に{入|はい}る{漢字|かんじ}は？") + '</p><p class="blank">' + escapeHtml(b.shown) + "</p>" +
          '<p class="muted">' + rich("{読|よ}み{方|かた}：") + escapeHtml(b.reading) + "</p>",
        choices: choiceList(b.correct, b.wrong)
      };
    }
  };
  function makeQuestion(entry, rnd, forcedType) {
    const types = questionTypes(entry);
    const type = forcedType || types[Math.floor(rnd() * types.length)];
    const others = shuffle(distractorPool(entry), rnd).slice(0, 2);
    const typeName = GAME_DATA.typeNames[entry.t] || "";
    const built = QUESTION_BUILDERS[type](entry, others, typeName, rnd);
    return {
      entry, type, promptHtml: built.promptHtml, choices: built.choices,
      heading: typeName, hard: entry.hard,
      phrase: { word: entry.w, meaning: entry.m }
    };
  }

  // ---- データの確認 ----
  function showError(message) {
    app.innerHTML = '<div class="card error"><h2>ことばのデータの書き方に誤りがあります</h2><p>' + escapeHtml(message) + "</p></div>";
  }
  function checkFill(e, key, n) {
    if (!Array.isArray(e.fill) || e.fill.length !== 3) return n + "fill は [正しい字, まちがいの字, まちがいの字] の3つにしてください。";
    if (key.indexOf(e.fill[0]) < 0) return n + "fill の1つ目「" + e.fill[0] + "」が、ことばの中にありません。";
    if (new Set(e.fill).size !== 3) return n + "fill の3つの字が同じになっています。";
    // □にする字に、その字だけのふりがながついているか（読み方も□にするため）
    const count = key.split(e.fill[0]).length - 1;
    if (rubyParts(e.w).filter(p => p.base === e.fill[0]).length !== count) {
      return n + "fill の1つ目「" + e.fill[0] + "」には、{" + e.fill[0] + "|よみ} のように、その字だけのふりがなをつけてください。";
    }
    return null;
  }
  function checkYojiBlanks(e, n) {
    for (let p = 0; p < 4; p++) {
      if (yojiBlankCandidates(e, p).length < 2) return n + (p + 1) + "文字目の□問題で、まちがいの字が足りません。";
    }
    return null;
  }
  // 1つのことばの書き方を確かめる（seen は、もう出てきたことばの記録）
  function checkEntry(e, n, seen) {
    if (!e || !e.w || !e.m) return n + "w（ことば）か m（意味）がありません。";
    if (e.t !== "yoji" && e.t !== "kotowaza") return n + "t は \"yoji\" か \"kotowaza\" にしてください。";
    const key = plain(e.w);
    if (seen[key]) return n + "同じことばが2回書かれています。";
    seen[key] = true;
    if (/[{}|]/.test(plain(e.w))) return n + "ふりがなの書き方 {漢字|かんじ} がくずれています。";
    if (e.t === "yoji" && Array.from(key).length !== 4) return n + "四字熟語が4文字ではありません。";
    if (e.t === "yoji" && rubyParts(e.w).length !== 4) return n + "四字熟語のふりがなは {一|いっ}{石|せき}{二|に}{鳥|ちょう} のように、1字ずつつけてください。";
    if (e.note !== undefined && typeof e.note !== "string") return n + "note は \" \" でかこんだ文にしてください。";
    if (e.fill) {
      const fillError = checkFill(e, key, n);
      if (fillError) return fillError;
    }
    if (distractorPool(e).length < 2) return n + "まちがいの選択肢に使えることばが足りません。";
    if (e.t === "yoji") return checkYojiBlanks(e, n);
    return null;
  }
  // 意味がまったく同じことばは、same で仲間にしないと正解が2つになる
  function checkSameMeaning() {
    const byMeaning = {};
    for (const e of STOCK) {
      const k = e.t + ":" + e.m;
      if (byMeaning[k] && !(e.same && byMeaning[k].same === e.same)) return "「" + plain(e.w) + "」と「" + plain(byMeaning[k].w) + "」の意味が同じです。same で仲間にしてください。";
      byMeaning[k] = e;
    }
    return null;
  }
  function checkData() {
    if (typeof GAME_DATA === "undefined" || typeof STOCK === "undefined" || !Array.isArray(STOCK)) {
      return "データ全体が読み込めませんでした。「\"」「,」「{ }」「[ ]」が消えていないか確認してください。";
    }
    const seen = {};
    for (let i = 0; i < STOCK.length; i++) {
      const e = STOCK[i];
      const entryError = checkEntry(e, (i + 1) + "番目（" + plain(e && e.w) + "）：", seen);
      if (entryError) return entryError;
    }
    return checkSameMeaning();
  }

  const err = checkData();
  if (err) { showError(err); return; }

  const D = GAME_DATA;
  const isDaily = new URLSearchParams(location.search).get("mode") === "daily";
  let playQs = [];
  let playRnd = Math.random;
  let playDay = today(); // 遊び始めた日（夜0時をまたいでも、この日のおつかいとして記録する）
  let answers = [];
  let newWords = [];
  let current = 0;

  // ---- まちの記録（この端末のブラウザの中だけに保存） ----
  const STORE_KEY = "machi-game-v1";
  function loadStore() {
    try {
      // 記録がこわれていても止まらないように、形がちがうものは空にしてから使う
      const isObject = v => !!v && typeof v === "object" && !Array.isArray(v);
      let s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (!isObject(s)) s = {};
      if (!isObject(s.words)) s.words = {};
      if (!isObject(s.catalog)) s.catalog = {};
      s.people = Number(s.people) || 0;
      s.turn = Number(s.turn) || 0;
      return s;
    } catch (e) { return { words: {}, catalog: {}, people: 0, turn: 0 }; }
  }
  function saveStore(s) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* 保存できない環境では記録しない */ }
  }
  function isLearned(s, entry) { return !!s.words[plain(entry.w)]; }
  function registerCatalog() {
    const s = loadStore();
    s.catalog[D.gameId] = { title: D.title, words: STOCK.map(e => ({ word: e.w, meaning: e.m, same: e.same || "", note: e.note || "" })) };
    saveStore(s);
  }
  function learnWord(entry) {
    const s = loadStore();
    if (isLearned(s, entry)) return;
    s.words[plain(entry.w)] = { gameId: D.gameId, word: entry.w, meaning: entry.m };
    saveStore(s);
    newWords.push({ word: entry.w, meaning: entry.m });
  }
  registerCatalog();

  // ---- 画面の部品 ----
  function phraseHtml(p) {
    if (!p || !p.word) return "";
    return '<div class="phrase"><div class="label">きょうのことば</div><div class="word">' + rich(p.word) +
      "</div><div>" + escapeHtml(p.meaning || "") + "</div></div>";
  }
  function top() { window.scrollTo(0, 0); }
  function seasonLabel(i) { return SEASON_ICONS[i] + " " + rich(SEASONS[i]); }
  // 意味の文（w2m の選択肢）にはふりがなの書き方がないので、そのまま出す
  function choiceLabelHtml(q, label) { return q.type === "w2m" ? escapeHtml(label) : rich(label); }

  // この回のことばをえらぶ（まだ覚えていないことばを先に出す）
  function pickEntries(rnd) {
    if (isDaily) return [STOCK[Math.floor(rnd() * STOCK.length)]];
    const s = loadStore();
    const fresh = shuffle(STOCK.filter(e => !isLearned(s, e)), rnd);
    const known = shuffle(STOCK.filter(e => isLearned(s, e)), rnd);
    return fresh.concat(known).slice(0, D.count || 5);
  }
  function startPlay() {
    playDay = today();
    playRnd = isDaily ? seededRandom(playDay + ":" + D.gameId) : Math.random;
    playQs = pickEntries(playRnd).map(e => makeQuestion(e, playRnd));
    answers = []; newWords = []; current = 0;
    showQuestion();
  }

  // ---- はじめ ----
  function dailyIntroHtml(s) {
    const done = s.dailyDone === today();
    return "<h1>" + rich("{今日|きょう}のおつかい") + "</h1>" +
      "<p>" + rich("{今日|きょう}だけの1{問|もん}。{正解|せいかい}すると、まちの{人口|じんこう}が") + "<b>" + (D.peopleDailyBonus || 0) + rich("{人|にん}") + "</b>" + rich("ふえるよ（1{日|にち}1{回|かい}）。") + "</p>" +
      (done ? '<p class="muted">' + rich("{今日|きょう}のおつかいは、もうやったよ。{遊|あそ}べるけれど、{人口|じんこう}はふえないよ。また{明日|あした}！") + "</p>" : "");
  }
  function normalIntroHtml(s) {
    const learnedHere = STOCK.filter(e => isLearned(s, e)).length;
    return "<h1>" + rich(D.title) + "</h1>" +
      "<p>" + rich(D.howToPlay) + "</p>" +
      '<p class="muted">' + rich("この{図書館|としょかん}のことば：") + learnedHere + " / " + STOCK.length + rich(" こ{覚|おぼ}えた") + "<br>" +
      rich("いまのまちの{季節|きせつ}：") + seasonLabel(s.turn % 4) + "</p>";
  }
  function showStart() {
    document.title = plain(D.title);
    const s = loadStore();
    const info = isDaily ? dailyIntroHtml(s) : normalIntroHtml(s);
    app.innerHTML =
      '<div class="card"><p class="muted">' + rich(D.shopName || "") + "</p>" + info + "</div>" +
      '<button class="btn primary" id="startBtn" type="button">はじめる</button>';
    document.getElementById("startBtn").onclick = startPlay;
    top();
  }

  // ---- 問題 ----
  function isLastQuestion() { return current === playQs.length - 1; }
  function progressPercent(done) { return done / playQs.length * 100; }
  function questionHtml(q, choices) {
    return '<div class="progress-text">' + rich((current + 1) + " / " + playQs.length + " {問目|もんめ}") + "</div>" +
      '<div class="progress"><div style="width:' + progressPercent(current) + '%"></div></div>' +
      '<div class="card">' +
        '<div class="industry">' + rich(q.heading) + "</div>" +
        (q.hard ? ' <div class="hard">' + rich("★むずかしい") + "</div>" : "") +
        q.promptHtml +
      "</div>" +
      '<div id="choices">' +
        choices.map((c, i) => '<button class="btn" type="button" data-i="' + i + '">' + choiceLabelHtml(q, c.label) + "</button>").join("") +
      "</div>" +
      '<div id="feedback"></div>';
  }
  function feedbackHtml(q, chosen) {
    const right = q.choices.find(c => c.points === 3);
    const fb = D.feedback || {};
    return '<div class="card">' +
        '<p class="feedback p' + chosen.points + '">' + rich(fb[chosen.points] || chosen.points + "点") + "</p>" +
        (chosen.points !== 3 ? "<p><b>" + rich("{正解|せいかい}：") + "</b>" + choiceLabelHtml(q, right.label) + "</p>" : "") +
        phraseHtml(q.phrase) +
      "</div>" +
      '<button class="btn primary" id="nextBtn" type="button">' + rich(isLastQuestion() ? "{結果|けっか}を{見|み}る" : "つぎへ") + "</button>";
  }
  function goNext() {
    if (isLastQuestion()) { showResult(); } else { current++; showQuestion(); }
  }
  function choose(q, chosen, btn) {
    answers[current] = chosen;
    if (chosen.points === 3) learnWord(q.entry);
    app.querySelectorAll("#choices .btn").forEach(b => { b.disabled = true; });
    btn.classList.add("chosen");
    app.querySelector(".progress > div").style.width = progressPercent(current + 1) + "%";
    document.getElementById("feedback").innerHTML = feedbackHtml(q, chosen);
    const next = document.getElementById("nextBtn");
    next.onclick = goNext;
    next.scrollIntoView({ behavior: "smooth", block: "end" });
  }
  function showQuestion() {
    const q = playQs[current];
    const choices = shuffle(q.choices, playRnd);
    app.innerHTML = questionHtml(q, choices);
    app.querySelectorAll("#choices .btn").forEach(btn => {
      btn.onclick = () => choose(q, choices[Number(btn.dataset.i)], btn);
    });
    top();
  }

  // ---- まちの記録を進める（人口・季節・今日のおつかい） ----
  function peopleAddedNews(n) {
    return rich("まちの{人口|じんこう}が") + "<b>" + n + "</b>" + rich("{人|にん}ふえた！");
  }
  function updateDailyTown(s, correctCount) {
    const firstToday = s.dailyDone !== playDay;
    s.dailyDone = playDay;
    if (firstToday && correctCount > 0) {
      s.people += D.peopleDailyBonus || 0;
      return [peopleAddedNews(D.peopleDailyBonus || 0)];
    }
    if (!firstToday) return [rich("{今日|きょう}のおつかいは2{回目|かいめ}なので、{人口|じんこう}はふえないよ。")];
    return [];
  }
  function updatePlayTown(s, correctCount) {
    const news = [];
    const add = correctCount * (D.peoplePerCorrect || 0);
    s.people += add;
    if (add > 0) news.push(peopleAddedNews(add));
    s.turn += 1;
    news.push(rich("まちの{季節|きせつ}が") + " " + seasonLabel(s.turn % 4) + " " + rich("になった。"));
    return news;
  }
  function updateTown(correctCount) {
    const s = loadStore();
    const news = isDaily ? updateDailyTown(s, correctCount) : updatePlayTown(s, correctCount);
    news.push(rich("いまの{人口|じんこう}：") + "<b>" + s.people.toLocaleString("ja-JP") + "</b>" + rich("{人|にん}"));
    saveStore(s);
    return news;
  }

  // ---- 結果 ----
  function resultMessage(total) {
    const msg = D.results.slice().sort((a, b) => b.minPoints - a.minPoints).find(r => total >= r.minPoints);
    return msg ? msg.message : "";
  }
  function scoreCardHtml(total) {
    return '<div class="card" style="text-align:center">' +
        '<p class="muted">' + rich("{結果|けっか}") + "</p>" +
        '<p class="score">' + total + " / " + playQs.length * 3 + rich("{点|てん}") + "</p>" +
        (isDaily ? "" : "<h2>" + rich(resultMessage(total)) + "</h2>") +
      "</div>";
  }
  function townNewsHtml(news) {
    return '<div class="card town-news"><h2>' + rich("まちのニュース") + "</h2>" + news.map(n => "<p>" + n + "</p>").join("") + "</div>";
  }
  function newWordsHtml() {
    if (!newWords.length) return "";
    return '<div class="card"><h2>' + rich("{新|あたら}しく{覚|おぼ}えたことば") + "</h2>" + newWords.map(phraseHtml).join("") + "</div>";
  }
  function recapHtml(q, i) {
    const c = answers[i];
    return '<div class="card recap">' +
        "<h3>" + (i + 1) + ". " + rich(q.entry.w) + ' <b class="p' + c.points + '">（' + c.points + rich("{点|てん}") + "）</b></h3>" +
        '<p class="muted">' + escapeHtml(q.entry.m) + "</p>" +
      "</div>";
  }
  function resultButtonsHtml() {
    return (isDaily ? "" : '<button class="btn primary" id="againBtn" type="button">' + rich("もう{一度|いちど}あそぶ（ことばがかわるよ）") + "</button>") +
      '<a class="btn secondary" href="index.html" style="text-decoration:none">' + rich("まちへ{戻|もど}る") + "</a>";
  }
  function showResult() {
    const total = answers.reduce((s, c) => s + c.points, 0);
    const correct = answers.filter(c => c.points === 3).length;
    const news = updateTown(correct);
    app.innerHTML =
      scoreCardHtml(total) +
      townNewsHtml(news) +
      newWordsHtml() +
      playQs.map(recapHtml).join("") +
      resultButtonsHtml();
    if (!isDaily) document.getElementById("againBtn").onclick = showStart;
    top();
  }

  // 自動チェック用（画面には関係しない）
  window.__library = { STOCK, makeQuestion, checkData, plain, reading, seededRandom };

  showStart();
})();
</script>
