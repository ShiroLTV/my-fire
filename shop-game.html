<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お店の店長になろう</title>

<script>
/* ===== ここから問題データ（文章はここだけ直してください） =====
   ・直してよいのは " " の中の文字と、数字だけです
   ・ふりがな：{漢字|かんじ} と書くと、漢字の上にふりがなが出ます
   ・points は 1問につき 3・1・0 を1つずつ
   ・数字が毎回変わる問題：
       vars に「使う数の候補」を書きます（例：use: [8, 10, 12]）
       文章の中で [use] と書くと、その数が入ります
       [use*3] [use+5] のように、＋ − × ÷（+ - * /）の計算も書けます
   ・hard: true と書くと、問題に「★むずかしい」の印がつきます
   ・季節のない問題は「問題の山」になり、毎回くじで pickCount 問（書かなければ4問）が出ます
   ・season：その季節だけに出る問題（0＝春、1＝夏、2＝秋、3＝冬）。書かなければ毎回出ます
*/
const GAME_DATA = {
  gameId: "shop",   // まちの地図の駅と同じ id（変えないでください）
  title: "お店の{店長|てんちょう}になろう",
  shopName: "まんまるおにぎり{堂|どう}",
  howToPlay: "あなたはおにぎり{屋|や}の{店長|てんちょう}。5つの{場面|ばめん}で、いちばんよいと{思|おも}う{答|こた}えを{選|えら}ぼう。{数字|すうじ}は{毎回|まいかい}かわるよ。",
  seasons: ["{春|はる}", "{夏|なつ}", "{秋|あき}", "{冬|ふゆ}"],
  feedback: {
    3: "3点！ よい{判断|はんだん}！",
    1: "1点 まあまあ",
    0: "0点 ざんねん"
  },
  questions: [
    {
      heading: "お{米|こめ}の{仕入|しい}れ",
      industry: "{第|だい}1{次|じ}{産業|さんぎょう}：お{米|こめ}をつくる",
      vars: { use: [8, 10, 12, 15], days: [2, 3, 4] },
      text: "{近|ちか}くの{農家|のうか}さんからお{米|こめ}を{仕入|しい}れている。お{店|みせ}では1{日|にち}にお{米|こめ}を[use]kg{使|つか}う。{農家|のうか}さんは[days]{日|か}に1{回|かい}とどけてくれる。お{店|みせ}の{倉庫|そうこ}には[use*days+5]kgまで{入|はい}る。1{回|かい}に{何|なん}kg{仕入|しい}れる？",
      choices: [
        { label: "[use*days]kg", points: 3 },
        { label: "[use*(days-1)]kg", points: 1 },
        { label: "[use*days*3]kg", points: 0 }
      ],
      explanation: "[use]kg × [days]{日|か} ＝ [use*days]kg で、{次|つぎ}にとどくまでちょうど{足|た}りて{倉庫|そうこ}にも{入|はい}る。[use*(days-1)]kgだと[days]{日|か}{目|め}にお{米|こめ}がなくなり、[use*days*3]kgは{倉庫|そうこ}に{入|はい}らない。",
      phrase: { word: "{備|そな}えあれば{憂|うれ}いなし", meaning: "ふだんから{準備|じゅんび}しておけば、{困|こま}ったときも{心配|しんぱい}がない" }
    },
    {
      heading: "おにぎりの{値段|ねだん}",
      industry: "{第|だい}3{次|じ}{産業|さんぎょう}：{売|う}る",
      vars: { cost: [50, 60, 70, 80], other: [30, 40, 50] },
      text: "おにぎり1{個|こ}の{材料費|ざいりょうひ}（お{米|こめ}・のり・{具|ぐ}）は[cost]{円|えん}。ほかに、{電気代|でんきだい}やお{店|みせ}の{家賃|やちん}が1{個|こ}あたり[other]{円|えん}かかる。{近|ちか}くのお{店|みせ}のおにぎりは[cost+other+50]{円|えん}。いくらで{売|う}る？",
      choices: [
        { label: "[cost+other+50]{円|えん}", points: 3 },
        { label: "[cost+other+150]{円|えん}", points: 1 },
        { label: "[cost+other-10]{円|えん}", points: 0 }

      explanation: "1{個|こ}にかかるお{金|かね}は [cost]{円|えん} ＋ [other]{円|えん} ＝ [cost+other]{円|えん}。[cost+other+50]{円|えん}なら1{個|こ}50{円|えん}のもうけ。100{個|こ}{売|う}れば5000{円|えん}になる。[cost+other-10]{円|えん}だと、{売|う}るたびに10{円|えん}の{赤字|あかじ}。[cost+other+150]{円|えん}はもうけが{大|おお}きいけれど、{高|たか}くて{買|か}う{人|ひと}が{減|へ}るかもしれない。",
      phrase: { word: "{塵|ちり}も{積|つ}もれば{山|やま}となる", meaning: "{小|ちい}さなものでも、たくさん{集|あつ}まれば{大|おお}きくなる" }

        { label: "{買|か}って、そのまま{生|なま}の{梅|うめ}としてお{店|みせ}で{売|う}る", points: 1 },
        { label: "うちには{関係|かんけい}ないので{断|ことわ}る", points: 0 }
      ],
      explanation: "{梅干|うめぼ}しに{加工|かこう}すれば、キズは{気|き}にならない。{梅干|うめぼ}し1{個|こ}でおにぎり1{個|こ}なら、[n]{個|こ}のおにぎりの{具|ぐ}になる。{農家|のうか}さんは{捨|す}てずにすみ、お{店|みせ}は{具|ぐ}を{安|やす}く{手|て}に{入|い}れられる。{生|なま}の{梅|うめ}はそのままでは{食|た}べにくく、{売|う}れにくい。",

        { label: "いっしょに「{農家|のうか}さんの{田|た}んぼのお{米|こめ}」と{名前|なまえ}をつけた{特別|とくべつ}なおにぎりをつくり、お{店|みせ}で{売|う}る", points: 3 },
        { label: "しばらく{様子|ようす}を{見|み}る", points: 1 },
        { label: "{商売|しょうばい}がたきになるので、お{米|こめ}の{取|と}り{引|ひ}きをやめる", points: 0 }

      phrase: { word: "{共存共栄|きょうぞんきょうえい}", meaning: "おたがいに{助|たす}け{合|あ}って、いっしょに{栄|さか}えること" }
    },

    {
      heading: "{値下|ねさ}げしたら{何個|なんこ}{売|う}る？",
      hard: true,
      industry: "{第|だい}3{次|じ}{産業|さんぎょう}：{売|う}る",
      vars: { p: [120, 125] },
      text: "ふだんはおにぎり1{個|こ}150{円|えん}で、1{日|にち}100{個|こ}{売|う}れている。つくるのにかかるお{金|かね}は1{個|こ}100{円|えん}。[p]{円|えん}に{値下|ねさ}げしたら、1{日|にち}{何個|なんこ}{売|う}れれば、いまと{同|おな}じもうけになる？",
      choices: [
        { label: "[5000/(p-100)]{個|こ}", points: 3 },
        { label: "[5000/(p-100)-50]{個|こ}", points: 1 },
        { label: "[250-p]{個|こ}", points: 0 }
      ],
      explanation: "いまのもうけは (150 − 100) × 100 ＝ 5,000{円|えん}。[p]{円|えん}だと1{個|こ}のもうけは[p-100]{円|えん}なので、5,000 ÷ [p-100] ＝ [5000/(p-100)]{個|こ}{売|う}る{必要|ひつよう}がある。{値下|ねさ}げした{分|ぶん}だけ{数|かず}をふやせばいい（[250-p]{個|こ}）、というわけではない。",
      phrase: { word: "{薄利多売|はくりたばい}", meaning: "一つあたりのもうけを{少|すく}なくして、たくさん{売|う}ってもうけること" }
    },
    {
      heading: "{朝|あさ}のお{客|きゃく}さん",
      industry: "{第|だい}3{次|じ}{産業|さんぎょう}：{売|う}る",
      vars: { n: [30, 50, 80] },
      text: "お{店|みせ}の{前|まえ}の{道|みち}は、{朝|あさ}7{時|じ}から8{時|じ}に、{駅|えき}へ{向|む}かう{人|ひと}が[n*10]{人|にん}ほど{通|とお}る。いまの{開店|かいてん}は10{時|じ}。どうする？",
      choices: [
        { label: "{朝|あさ}6{時|じ}から{準備|じゅんび}して、7{時|じ}に{開|あ}けてみる", points: 3 },
        { label: "いつもどおり10{時|じ}に{開|あ}ける", points: 1 },
        { label: "{夜|よる}おそくまで{開|あ}けて、{朝|あさ}はもっとおそく{開|あ}ける", points: 0 }
      ],
      explanation: "[n*10]{人|にん}のうち1{割|わり}が{買|か}ってくれたら、[n]{個|こ}{多|おお}く{売|う}れる。まずは{少|すこ}しの{間|あいだ}ためしてみて、{本当|ほんとう}に{売|う}れるか{記録|きろく}をとろう。",
      phrase: { word: "{早起|はやお}きは{三文|さんもん}の{徳|とく}", meaning: "{朝早|あさはや}く{起|お}きると、{何|なに}かしらよいことがあるということ" }
    },

    /* ---- ここから季節の問題（その季節のときだけ5問目に出る） ---- */
    {
      season: 0,
      heading: "お{花見|はなみ}のおにぎり",
      industry: "{第|だい}3{次|じ}{産業|さんぎょう}：{売|う}る",
      vars: { usual: [80, 100, 120, 140] },
      text: "{明日|あした}は{近|ちか}くの{公園|こうえん}でお{花見|はなみ}。ふだんは1{日|にち}[usual]{個|こ}{売|う}れるが、お{花見|はなみ}の{日|ひ}はその1.5{倍|ばい}{売|う}れる。{明日|あした}は{何個|なんこ}つくる？",
      choices: [
        { label: "[usual*1.5]{個|こ}", points: 3 },
        { label: "[usual]{個|こ}", points: 1 },
        { label: "[usual*3]{個|こ}", points: 0 }
      ],
      explanation: "[usual]{個|こ}の1.5{倍|ばい}は[usual*1.5]{個|こ}。いつもと{同|おな}じ[usual]{個|こ}だと{売|う}り{切|き}れて{買|か}えない{人|ひと}が{出|で}る。[usual*3]{個|こ}だと[usual*1.5]{個|こ}も{売|う}れ{残|のこ}る。",
      phrase: { word: "{花|はな}より{団子|だんご}", meaning: "{見|み}て{楽|たの}しむものより、{実際|じっさい}に{役|やく}に{立|た}つもののほうがうれしいこと" }
    },
    {
      season: 1,
      heading: "{梅雨|つゆ}の{雨|あめ}の{日|ひ}",
      industry: "{第|だい}3{次|じ}{産業|さんぎょう}：{売|う}る",
      vars: { usual: [100, 200, 300] },
      text: "{明日|あした}は{雨|あめ}の{予報|よほう}。ふだんは1{日|にち}[usual]{個|こ}{売|う}れるが、{雨|あめ}の{日|ひ}はその7{割|わり}ほどしか{売|う}れない。{明日|あした}は{何個|なんこ}つくる？",
      choices: [
        { label: "[usual*0.7]{個|こ}", points: 3 },
        { label: "[usual*0.5]{個|こ}", points: 1 },
        { label: "[usual]{個|こ}", points: 0 }
      ],
      explanation: "[usual]{個|こ}の7{割|わり}は[usual*0.7]{個|こ}。[usual]{個|こ}つくると[usual*0.3]{個|こ}{売|う}れ{残|のこ}り、[usual*0.5]{個|こ}だと{買|か}えないお{客|きゃく}さんが{出|で}る。",
      phrase: { word: "{臨機応変|りんきおうへん}", meaning: "その{場|ば}のようすに{合|あ}わせて、やり{方|かた}を{変|か}えること" }
    },
    {
      season: 2,
      heading: "{新米|しんまい}の{季節|きせつ}",
      industry: "{第|だい}1{次|じ}{産業|さんぎょう}：お{米|こめ}をつくる",
      vars: { up: [10, 20, 30], n: [100, 200] },
      text: "{秋|あき}の{新米|しんまい}はおいしいけれど、{仕入|しい}れ{値|ね}が{上|あ}がって、おにぎり1{個|こ}あたり[up]{円|えん}{高|たか}くなった。1{日|にち}に[n]{個|こ}{売|う}れる。どうする？",
      choices: [
        { label: "[up]{円|えん}{値上|ねあ}げして、「{新米|しんまい}です」とお{店|みせ}に{書|か}く", points: 3 },
        { label: "{値段|ねだん}はそのままにする", points: 1 },
        { label: "[up*10]{円|えん}{値上|ねあ}げする", points: 0 }
      ],
      explanation: "{値段|ねだん}がそのままだと、1{日|にち}に[up]{円|えん} × [n]{個|こ} ＝ [up*n]{円|えん}もうけが{減|へ}る。[up]{円|えん}だけ{上|あ}げて{理由|りゆう}を{伝|つた}えれば、お{客|きゃく}さんも{納得|なっとく}しやすい。[up*10]{円|えん}も{上|あ}げると、{買|か}う{人|ひと}が{減|へ}ってしまう。",
      phrase: { word: "{天高|てんたか}く{馬肥|うまこ}ゆる{秋|あき}", meaning: "{秋|あき}は{空|そら}が{晴|は}れて、{食|た}べものがおいしい{季節|きせつ}だということ" }
    },
    {
      season: 3,
      heading: "{雪|ゆき}の{日|ひ}のおにぎり",
      industry: "{第|だい}3{次|じ}{産業|さんぎょう}：{売|う}る",
      vars: { usual: [100, 150, 200] },
      text: "{明日|あした}は{雪|ゆき}の{予報|よほう}。ふだんは1{日|にち}[usual]{個|こ}{売|う}れるが、{雪|ゆき}の{日|ひ}は{出|で}かける{人|ひと}が{減|へ}って、その6{割|わり}ほどしか{売|う}れない。{明日|あした}は{何個|なんこ}つくる？",

        { label: "[usual*0.6]{個|こ}", points: 3 },
        { label: "[usual*0.3]{個|こ}", points: 1 },
        { label: "[usual]{個|こ}", points: 0 }
      ],
      explanation: "[usual]{個|こ}の6{割|わり}は[usual*0.6]{個|こ}。[usual]{個|こ}つくると[usual*0.4]{個|こ}{売|う}れ{残|のこ}る。[usual*0.3]{個|こ}だと{少|すく}なすぎて、{来|き}てくれたお{客|きゃく}さんが{買|か}えない。",

    }

    { minPoints: 8,  message: "なかなかの{店長|てんちょう}！" },

};
/* ===== ここまで問題データ ===== */
</script>

<style>
  :root {
    --bg: #fdf8f0;
    --card: #ffffff;
    --text: #2b2620;
    --muted: #6b6258;
    --accent: #d9622b;
    --accent-text: #ffffff;
    --line: #e8dfd2;
    --good: #2f8a4c;
    --soso: #b7860b;
    --bad: #b5453a;
    --phrase-bg: #fff3d6;
    --phrase-line: #e9b949;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1b17;
      --card: #2a2520;
      --text: #f2ece4;
      --muted: #b5aa9c;
      --accent: #f07f45;
      --accent-text: #1f1b17;
      --line: #423a32;
      --good: #6cc78a;
      --soso: #e3b84a;
      --bad: #ee7d72;
      --phrase-bg: #3a3020;
      --phrase-line: #a8822f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    font-size: 18px;
    line-height: 1.9;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .topbar a { color: var(--muted); font-size: 15px; }
  .ruby-toggle {
    min-height: 44px; padding: 0 14px; border-radius: 22px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    font: inherit; font-size: 15px; cursor: pointer;
  }
  body.no-ruby rt { display: none; }
  rt { font-size: 0.55em; }
  h1 { font-size: 26px; line-height: 1.6; margin: 8px 0 4px; }
  h2 { font-size: 20px; margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .muted { color: var(--muted); }
  .btn {
    display: block; width: 100%; min-height: 56px; margin: 0 0 10px;
    padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; text-align: left;
    cursor: pointer; line-height: 1.8;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { cursor: default; opacity: 0.55; }
  .btn.chosen { opacity: 1; border-color: var(--accent); border-width: 3px; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); text-align: center; font-weight: bold; }
  .btn.secondary { text-align: center; }
  .progress-text { font-size: 15px; color: var(--muted); }
  .progress { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin: 4px 0 16px; }
  .progress > div { height: 100%; background: var(--accent); transition: width .3s; }
  .industry { display: inline-block; font-size: 14px; padding: 2px 12px; border-radius: 12px; background: var(--phrase-bg); border: 1px solid var(--phrase-line); margin-bottom: 8px; }
  .hard { display: inline-block; font-size: 14px; padding: 2px 12px; border-radius: 12px; background: var(--bad); color: var(--card); font-weight: bold; margin-bottom: 8px; }
  .feedback { font-size: 22px; font-weight: bold; margin: 0 0 6px; }
  .p3 { color: var(--good); } .p1 { color: var(--soso); } .p0 { color: var(--bad); }
  .phrase { background: var(--phrase-bg); border-left: 6px solid var(--phrase-line); border-radius: 10px; padding: 12px 14px; margin: 14px 0 4px; }
  .phrase .label { font-size: 14px; color: var(--muted); }
  .phrase .word { font-size: 22px; font-weight: bold; }
  .score { font-size: 40px; font-weight: bold; color: var(--accent); margin: 0; }
  .town-news p { margin: 4px 0; }
  .town-news b { color: var(--accent); }
  .recap h3 { font-size: 18px; margin: 0 0 4px; }
  .recap p { margin: 4px 0; }
  .error { border-color: var(--bad); color: var(--bad); }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <a href="index.html">← まちへ{戻|もど}る</a>
    <button class="ruby-toggle" id="rubyToggle" type="button">ふりがな：あり</button>
  </div>
  <div id="app"></div>
</main>

<script>
(function () {
  const app = document.getElementById("app");
  const rubyToggle = document.getElementById("rubyToggle");
  const SEASON_ICONS = ["🌸", "☀️", "🍁", "⛄"];

  // ---- ふりがな ----
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function rich(s) {
    return escapeHtml(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
  }
  function plain(s) { return String(s || "").replace(/\{([^{}|]+)\|[^{}|]+\}/g, "$1"); }
  document.querySelectorAll(".topbar a").forEach(a => { a.innerHTML = rich(a.textContent); });
  rubyToggle.addEventListener("click", () => {
    const off = document.body.classList.toggle("no-ruby");
    rubyToggle.textContent = off ? "ふりがな：なし" : "ふりがな：あり";
  });

  // ---- 数字が毎回変わる問題 ----
  function calc(expr, vars) {
    if (!/^[\w\s+\-*/().]+$/.test(expr)) throw new Error("[" + expr + "] に使えない文字があります。");
    (expr.match(/[A-Za-z_]\w*/g) || []).forEach(id => {
      if (!(id in vars)) throw new Error("[" + expr + "] の「" + id + "」が vars にありません。");
    });
    const names = Object.keys(vars);
    const n = Function(...names, '"use strict"; return (' + expr + ");")(...names.map(k => vars[k]));
    if (typeof n !== "number" || !isFinite(n)) throw new Error("[" + expr + "] の計算ができません。");
    return n;
  }
  function fmt(n) { return (Math.round(n * 10) / 10).toLocaleString("ja-JP"); }
  function fill(str, vars) { return String(str || "").replace(/\[([^\[\]]+)\]/g, (_, e) => fmt(calc(e, vars))); }
  function pickVars(q, rnd) {
    const v = {};
    Object.keys(q.vars || {}).forEach(k => { const arr = q.vars[k]; v[k] = arr[Math.floor(rnd() * arr.length)]; });
    return v;
  }
  function makeQuestion(q, rnd) {
    const v = pickVars(q, rnd);
    return {
      src: q,
      heading: q.heading, industry: q.industry, phrase: q.phrase, hard: q.hard,
      text: fill(q.text, v),
      explanation: fill(q.explanation, v),
      choices: q.choices.map(c => ({ label: fill(c.label, v), points: c.points }))
    };
  }
  // 日付から決まる乱数（今日のおつかいで、同じ日は同じ問題になる）
  function seededRandom(seedText) {
    let h = 2166136261;
    for (let i = 0; i < seedText.length; i++) { h ^= seedText.charCodeAt(i); h = Math.imul(h, 16777619); }
    return function () {
      h += 0x6D2B79F5;
      let t = h;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function today() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  // ---- データの確認 ----
  function showError(message) {
    app.innerHTML = '<div class="card error"><h2>問題データの書き方に誤りがあります</h2><p>' + escapeHtml(message) + "</p></div>";
  }
  function allVarCombos(q) {
    let combos = [{}];
    Object.keys(q.vars || {}).forEach(k => {
      const arr = q.vars[k];
      if (!Array.isArray(arr) || arr.length === 0) throw new Error("vars の「" + k + "」に数がありません。");
      const next = [];
      combos.forEach(c => arr.forEach(val => next.push(Object.assign({}, c, { [k]: val }))));
      combos = next;
    });
    return combos;
  }
  function checkData() {
    if (typeof GAME_DATA === "undefined") {
      return "データ全体が読み込めませんでした。「\"」「,」「{ }」「[ ]」が消えていないか確認してください。";
    }
    const qs = GAME_DATA.questions;
    if (!Array.isArray(qs) || qs.length === 0) return "questions に問題が1つもありません。";
    for (let i = 0; i < qs.length; i++) {
      const q = qs[i], n = (i + 1) + "問目：";
      if (!q || !q.text) return n + "text（問題文）がありません。";
      if (!Array.isArray(q.choices) || q.choices.length !== 3) return n + "選択肢は3つにしてください。";
      const pts = q.choices.map(c => c && c.points).sort().join(",");
      if (pts !== "0,1,3") return n + "points は 3・1・0 を1つずつにしてください。";
      if (q.choices.some(c => !c.label)) return n + "label（選択肢の文）が空のものがあります。";
      if (!q.explanation) return n + "explanation（解説）がありません。";
      try {
        for (const v of allVarCombos(q)) {
          fill(q.text, v); fill(q.explanation, v);
          const labels = q.choices.map(c => fill(c.label, v));
          if (new Set(labels).size !== 3) {
            return n + "数の組み合わせによって、選択肢が同じになってしまいます（" + labels.map(plain).join("／") + "）。";
          }
        }
      } catch (e) { return n + e.message; }
    }
    if (!Array.isArray(GAME_DATA.results) || GAME_DATA.results.length === 0) return "results（点数のひとこと）がありません。";
    return null;
  }

  const err = checkData();
  if (err) { showError(err); return; }

  const D = GAME_DATA;
  const SEASONS = D.seasons || ["春", "夏", "秋", "冬"];
  const isDaily = new URLSearchParams(location.search).get("mode") === "daily";
  let playQs = [];    // この回に出す問題
  let answers = [];   // 各問で選んだ選択肢
  let newWords = [];  // この回で新しく覚えたことば
  let current = 0;

  // ---- まちの記録（この端末のブラウザの中だけに保存） ----
  const STORE_KEY = "machi-game-v1";
  function loadStore() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY)) || {};
      s.words = s.words || {};
      s.catalog = s.catalog || {};
      s.people = s.people || 0;
      s.turn = s.turn || 0;
      return s;
    } catch (e) { return { words: {}, catalog: {}, people: 0, turn: 0 }; }
  }
  function saveStore(s) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* 保存できない環境では記録しない */ }
  }
  // このゲームで覚えられることばの一覧を、まちの「ことば図鑑」のために登録する
  function registerCatalog() {
    if (!D.gameId) return;
    const s = loadStore();
    s.catalog[D.gameId] = {
      title: D.title,
      words: D.questions.filter(q => q.phrase && q.phrase.word).map(q => ({ word: q.phrase.word, meaning: q.phrase.meaning || "" }))
    };
    saveStore(s);
  }
  function learnWord(q) {
    if (!D.gameId || !q.phrase || !q.phrase.word) return;
    const key = plain(q.phrase.word);
    const s = loadStore();
    if (s.words[key]) return;
    s.words[key] = { gameId: D.gameId, word: q.phrase.word, meaning: q.phrase.meaning || "" };
    saveStore(s);
    newWords.push(q.phrase);
  }
  function seasonIndex() { return loadStore().turn % 4; }
  registerCatalog();

  function shuffle(arr, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function best(q) { return q.choices.find(c => c.points === 3); }
  function phraseHtml(p) {
    if (!p || !p.word) return "";
    return '<div class="phrase"><div class="label">きょうのことば</div><div class="word">' + rich(p.word) +
      "</div><div>" + rich(p.meaning || "") + "</div></div>";
  }
  function top() { window.scrollTo(0, 0); }
  function seasonLabel(i) { return SEASON_ICONS[i] + " " + rich(SEASONS[i]); }

  // この回の問題をえらぶ
  function preparePlay() {
    if (isDaily) {
      const rnd = seededRandom(today() + ":" + D.gameId);
      const q = D.questions[Math.floor(rnd() * D.questions.length)];
      playQs = [makeQuestion(q, rnd)];
      playQs.rnd = rnd;
    } else {
      // いつも出る問題の山から、毎回くじで pickCount 問（ふつうは4問）＋季節の問題
      const si = seasonIndex();
      const core = shuffle(D.questions.filter(q => typeof q.season !== "number"), Math.random).slice(0, D.pickCount || 4);
      const qs = core.concat(D.questions.filter(q => q.season === si));
      playQs = qs.map(q => makeQuestion(q, Math.random));
      playQs.rnd = Math.random;
    }
  }

  // ---- 画面B：はじめ ----
  function showStart() {
    document.title = plain(D.title);
    const s = loadStore();
    let info;
    if (isDaily) {
      const done = s.dailyDone === today();
      info =
        "<h1>" + rich("{今日|きょう}のおつかい") + "</h1>" +
        "<p>" + rich("{今日|きょう}だけの1{問|もん}。3{点|てん}をとると、まちの{人口|じんこう}が") + "<b>" + (D.peopleDailyBonus || 0) + rich("{人|にん}") + "</b>" + rich("ふえるよ（1{日|にち}1{回|かい}）。") + "</p>" +
        (done ? '<p class="muted">' + rich("{今日|きょう}のおつかいは、もうやったよ。{遊|あそ}べるけれど、{人口|じんこう}はふえないよ。また{明日|あした}！") + "</p>" : "");
    } else {
      const si = seasonIndex();
      info =
        "<h1>" + rich(D.title) + "</h1>" +
        "<p>" + rich(D.howToPlay) + "</p>" +
        '<p class="muted">' + rich("いまのまちの{季節|きせつ}：") + seasonLabel(si) + "<br>" +
        rich("3{点|てん}をとるたびに、まちの{人口|じんこう}が" + (D.peoplePerCorrect || 0) + "{人|にん}ふえるよ。") + "</p>";
    }
    app.innerHTML =
      '<div class="card">' +
        '<p class="muted">' + rich(D.shopName || "") + "</p>" +
        info +
      "</div>" +
      '<button class="btn primary" id="startBtn" type="button">はじめる</button>';
    document.getElementById("startBtn").onclick = () => {
      preparePlay();
      answers = []; newWords = []; current = 0;
      showQuestion();
    };
    top();
  }

  // ---- 画面C：問題 ----
  function showQuestion() {
    const q = playQs[current];
    const choices = shuffle(q.choices, playQs.rnd);
    const isLast = current === playQs.length - 1;
    app.innerHTML =
      '<div class="progress-text">' + rich((current + 1) + " / " + playQs.length + " {問目|もんめ}") + "</div>" +
      '<div class="progress"><div style="width:' + (current / playQs.length * 100) + '%"></div></div>' +
      '<div class="card">' +
        (q.industry ? '<div class="industry">' + rich(q.industry) + "</div>" : "") +
        (q.hard ? ' <div class="hard">' + rich("★むずかしい") + "</div>" : "") +
        "<h2>" + rich(q.heading || "") + "</h2>" +
        "<p>" + rich(q.text) + "</p>" +
      "</div>" +
      '<div id="choices">' +
        choices.map((c, i) => '<button class="btn" type="button" data-i="' + i + '">' + rich(c.label) + "</button>").join("") +
      "</div>" +
      '<div id="feedback"></div>';

    app.querySelectorAll("#choices .btn").forEach(btn => {
      btn.onclick = () => {
        const chosen = choices[Number(btn.dataset.i)];
        answers[current] = chosen;
        if (chosen.points === 3) learnWord(q);
        app.querySelectorAll("#choices .btn").forEach(b => { b.disabled = true; });
        btn.classList.add("chosen");
        app.querySelector(".progress > div").style.width = ((current + 1) / playQs.length * 100) + "%";
        const b = best(q);
        const fb = D.feedback || {};
        document.getElementById("feedback").innerHTML =
          '<div class="card">' +
            '<p class="feedback p' + chosen.points + '">' + rich(fb[chosen.points] || chosen.points + "点") + "</p>" +
            (chosen.points !== 3 ? "<p><b>" + rich("いちばんよい{答|こた}え：") + "</b>" + rich(b.label) + "</p>" : "") +
            "<p>" + rich(q.explanation) + "</p>" +
            phraseHtml(q.phrase) +
          "</div>" +
          '<button class="btn primary" id="nextBtn" type="button"></button>';
        const next = document.getElementById("nextBtn");
        next.innerHTML = rich(isLast ? "{結果|けっか}を{見|み}る" : "つぎへ");
        next.onclick = () => { if (isLast) { showResult(); } else { current++; showQuestion(); } };
        next.scrollIntoView({ behavior: "smooth", block: "end" });
      };
    });
    top();
  }

  // まちの記録を進める（人口・季節・今日のおつかい）
  function updateTown(correctCount) {
    const s = loadStore();
    const news = [];
    if (isDaily) {
      const firstToday = s.dailyDone !== today();
      s.dailyDone = today();
      if (firstToday && correctCount > 0) {
        s.people += D.peopleDailyBonus || 0;
        news.push(rich("まちの{人口|じんこう}が") + "<b>" + (D.peopleDailyBonus || 0) + "</b>" + rich("{人|にん}ふえた！"));
      } else if (!firstToday) {
        news.push(rich("{今日|きょう}のおつかいは2{回目|かいめ}なので、{人口|じんこう}はふえないよ。"));
      }
    } else {
      const add = correctCount * (D.peoplePerCorrect || 0);
      s.people += add;
      if (add > 0) news.push(rich("まちの{人口|じんこう}が") + "<b>" + add + "</b>" + rich("{人|にん}ふえた！"));
      s.turn += 1;
      news.push(rich("まちの{季節|きせつ}が") + " " + seasonLabel(s.turn % 4) + " " + rich("になった。つぎは{季節|きせつ}の{問題|もんだい}もかわるよ。"));
    }
    news.push(rich("いまの{人口|じんこう}：") + "<b>" + s.people.toLocaleString("ja-JP") + "</b>" + rich("{人|にん}"));
    saveStore(s);
    return news;
  }

  // ---- 画面D：結果と解説 ----
  function showResult() {
    const total = answers.reduce((s, c) => s + c.points, 0);
    const correct = answers.filter(c => c.points === 3).length;
    const max = playQs.length * 3;
    const news = updateTown(correct);
    let html =
      '<div class="card" style="text-align:center">' +
        '<p class="muted">' + rich("{結果|けっか}") + "</p>" +
        '<p class="score">' + total + " / " + max + rich("{点|てん}") + "</p>";
    if (!isDaily) {
      const msg = D.results.slice().sort((a, b) => b.minPoints - a.minPoints).find(r => total >= r.minPoints);
      html += "<h2>" + rich(msg ? msg.message : "") + "</h2>";
    }
    html += "</div>";
    html += '<div class="card town-news"><h2>' + rich("まちのニュース") + "</h2>" + news.map(n => "<p>" + n + "</p>").join("") + "</div>";
    if (newWords.length) {
      html +=
        '<div class="card">' +
          "<h2>" + rich("{新|あたら}しく{覚|おぼ}えたことば") + "</h2>" +
          newWords.map(p => phraseHtml(p)).join("") +
          '<p style="margin-top:12px">' + rich("まちが{育|そだ}ったかもしれないよ。まちに{戻|もど}って{見|み}てみよう！") + "</p>" +
        "</div>";
    }
    playQs.forEach((q, i) => {
      const c = answers[i];
      html +=
        '<div class="card recap">' +
          "<h3>" + (i + 1) + ". " + rich(q.heading || "") + "</h3>" +
          "<p>" + rich("あなたの{答|こた}え：") + rich(c.label) + ' <b class="p' + c.points + '">（' + c.points + rich("{点|てん}") + "）</b></p>" +
          (c.points !== 3 ? "<p>" + rich("いちばんよい{答|こた}え：") + rich(best(q).label) + "</p>" : "") +
          '<p class="muted">' + rich(q.explanation) + "</p>" +
          phraseHtml(q.phrase) +
        "</div>";
    });
    html +=
      (isDaily ? "" : '<button class="btn primary" id="againBtn" type="button">' + rich("もう{一度|いちど}あそぶ（{数字|すうじ}がかわるよ）") + "</button>") +
      '<a class="btn secondary" href="index.html" style="text-decoration:none">' + rich("まちへ{戻|もど}る") + "</a>";
    app.innerHTML = html;
    if (!isDaily) document.getElementById("againBtn").onclick = showStart;
    top();
  }

  showStart();
})();
</script>
</body>
</html>
