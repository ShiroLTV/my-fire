<script>
(function () {
  const app = document.getElementById("app");
  const rubyToggle = document.getElementById("rubyToggle");
  const SEASON_ICONS = ["🌸", "☀️", "🍁", "⛄"];
  const SEASONS = ["{春|はる}", "{夏|なつ}", "{秋|あき}", "{冬|ふゆ}"];

  // ---- ふりがな ----
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function rich(s) {
    return escapeHtml(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
  }
  function plain(s) { return String(s || "").replace(/\{([^{}|]+)\|[^{}|]+\}/g, "$1"); }
  function setupRubyToggle() {
    document.querySelectorAll(".topbar a").forEach(a => { a.innerHTML = rich(a.textContent); });
    rubyToggle.addEventListener("click", () => {
      const off = document.body.classList.toggle("no-ruby");
      rubyToggle.textContent = off ? "ふりがな：なし" : "ふりがな：あり";
    });
  }
  setupRubyToggle();

  // ---- 乱数 ----
  function seededRandom(seedText) {
    let h = 2166136261;
    for (let i = 0; i < seedText.length; i++) { h ^= seedText.charCodeAt(i); h = Math.imul(h, 16777619); }
    return function () {
      h += 0x6D2B79F5;
      let t = h;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function today() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  // ---- 問題づくり ----
  // まちがいの選択肢に使えることば（同じジャンルで、説明がにている仲間ではないもの）
  function distractorPool(entry) {
    return STOCK.filter(e => e.t === entry.t && e !== entry && !(entry.same && e.same === entry.same));
  }
  function hasQuiz(entry) { return !!entry.q; }
  function questionTypes(entry) {
    const types = ["m2w", "w2m"];
    // 「なぜ？クイズ」は、実際に役立つ知識なので、ほかの問題より出やすくする
    if (hasQuiz(entry)) types.push("quiz", "quiz");
    return types;
  }
  function choiceList(correct, wrong) {
    return [{ label: correct, points: 3 }].concat(wrong.map(label => ({ label, points: 0 })));
  }
  // 問題の種類ごとの、問題文と選択肢のつくり方
  const QUESTION_BUILDERS = {
    // 説明 → ことば
    m2w(entry, others) {
      return {
        promptHtml: "<p>" + rich("つぎの{説明|せつめい}に{合|あ}うことばは？") + "</p><p><b>「" + escapeHtml(entry.m) + "」</b></p>",
        choices: choiceList(entry.w, others.map(e => e.w))
      };
    },
    // ことば → 説明
    w2m(entry, others) {
      return {
        promptHtml: "<p>" + rich("つぎのことばの{説明|せつめい}は？") + '</p><p class="big-word">' + rich(entry.w) + "</p>",
        choices: choiceList(entry.m, others.map(e => e.m))
      };
    },
    // なぜ？クイズ（q, a, x に書いた問題をそのまま出す）
    quiz(entry) {
      return {
        promptHtml: "<p><b>" + rich(entry.q) + "</b></p>",
        choices: choiceList(entry.a, entry.x)
      };
    }
  };
  function makeQuestion(entry, rnd, forcedType) {
    const types = questionTypes(entry);
    const type = forcedType || types[Math.floor(rnd() * types.length)];
    const others = shuffle(distractorPool(entry), rnd).slice(0, 2);
    const built = QUESTION_BUILDERS[type](entry, others, rnd);
    return {
      entry, type, promptHtml: built.promptHtml, choices: built.choices,
      heading: GAME_DATA.genres[entry.t] || "", hard: entry.hard,
      phrase: { word: entry.w, meaning: entry.m, note: entry.note, t: entry.t }
    };
  }

  // ---- データの確認 ----
  function showError(message) {
    app.innerHTML = '<div class="card error"><h2>ことばのデータの書き方に誤りがあります</h2><p>' + escapeHtml(message) + "</p></div>";
  }
  // なぜ？クイズの書き方を確かめる
  function checkQuiz(e, n) {
    if (e.q === undefined && e.a === undefined && e.x === undefined) return null;
    if (typeof e.q !== "string" || typeof e.a !== "string" || !e.q || !e.a) return n + "クイズは q（問題文）と a（正しい答え）の両方を \" \" でかこんで書いてください。";
    if (!Array.isArray(e.x) || e.x.length !== 2 || e.x.some(s => typeof s !== "string" || !s)) return n + "x は [\"まちがいの答え\", \"まちがいの答え\"] の2つにしてください。";
    if (new Set([e.a].concat(e.x)).size !== 3) return n + "クイズの答えの中に、同じものがあります。";
    return null;
  }
  // 1つのことばの書き方を確かめる（seen は、もう出てきたことばの記録）
  function checkEntry(e, n, seen) {
    if (!e || !e.w || !e.m) return n + "w（ことば）か m（説明）がありません。";
    if (!GAME_DATA.genres[e.t]) return n + "t は " + Object.keys(GAME_DATA.genres).map(k => "\"" + k + "\"").join("、") + " のどれかにしてください。";
    const key = plain(e.w);
    if (seen[key]) return n + "同じことばが2回書かれています。";
    seen[key] = true;
    if (/[{}|]/.test(plain(e.w))) return n + "ふりがなの書き方 {漢字|かんじ} がくずれています。";
    if (e.note !== undefined && typeof e.note !== "string") return n + "note は \" \" でかこんだ文にしてください。";
    const quizError = checkQuiz(e, n);
    if (quizError) return quizError;
    if (distractorPool(e).length < 2) return n + "同じジャンルに、まちがいの選択肢に使えることばが足りません。";
    return null;
  }
  // 説明がまったく同じことばは、same で仲間にしないと正解が2つになる
  function checkSameMeaning() {
    const byMeaning = {};
    for (const e of STOCK) {
      const k = e.t + ":" + e.m;
      if (byMeaning[k] && !(e.same && byMeaning[k].same === e.same)) return "「" + plain(e.w) + "」と「" + plain(byMeaning[k].w) + "」の説明が同じです。same で仲間にしてください。";
      byMeaning[k] = e;
    }
    return null;
  }
  function checkData() {
    if (typeof GAME_DATA === "undefined" || typeof STOCK === "undefined" || !Array.isArray(STOCK)) {
      return "データ全体が読み込めませんでした。「\"」「,」「{ }」「[ ]」が消えていないか確認してください。";
    }
    const seen = {};
    for (let i = 0; i < STOCK.length; i++) {
      const e = STOCK[i];
      const entryError = checkEntry(e, (i + 1) + "番目（" + plain(e && e.w) + "）：", seen);
      if (entryError) return entryError;
    }
    return checkSameMeaning();
  }

  const err = checkData();
  if (err) { showError(err); return; }

  const D = GAME_DATA;
  const isDaily = new URLSearchParams(location.search).get("mode") === "daily";
  let playQs = [];
  let playRnd = Math.random;
  let playDay = today(); // 遊び始めた日（夜0時をまたいでも、この日のおつかいとして記録する）
  let answers = [];
  let newWords = [];
  let current = 0;
  let playGenre = ""; // えらんだジャンル（"" は全部のジャンル）

  // ---- まちの記録（この端末のブラウザの中だけに保存） ----
  const STORE_KEY = "machi-game-v1";
  function loadStore() {
    try {
      // 記録がこわれていても止まらないように、形がちがうものは空にしてから使う
      const isObject = v => !!v && typeof v === "object" && !Array.isArray(v);
      let s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (!isObject(s)) s = {};
      if (!isObject(s.words)) s.words = {};
      if (!isObject(s.catalog)) s.catalog = {};
      s.people = Number(s.people) || 0;
      s.turn = Number(s.turn) || 0;
      return s;
    } catch (e) { return { words: {}, catalog: {}, people: 0, turn: 0 }; }
  }
  function saveStore(s) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* 保存できない環境では記録しない */ }
  }
  function isLearned(s, entry) { return !!s.words[plain(entry.w)]; }
  function registerCatalog() {
    const s = loadStore();
    // note（解説）は、まちの「ことば図鑑」では「ちがい」の欄に出てしまうので、いまは送らない
    s.catalog[D.gameId] = { title: D.title, words: STOCK.map(e => ({ word: e.w, meaning: e.m, same: e.same || "", note: "" })) };
    saveStore(s);
  }
  function learnWord(entry) {
    const s = loadStore();
    if (isLearned(s, entry)) return;
    s.words[plain(entry.w)] = { gameId: D.gameId, word: entry.w, meaning: entry.m };
    saveStore(s);
    newWords.push({ word: entry.w, meaning: entry.m });
  }
  registerCatalog();

  // ---- まちの名前（まちの地図と同じ名前を出して、このゲームが自分のまちの施設だとわかるようにする） ----
  // 覚えたことばの数で、まちの呼び名が変わる（index.html の townLevels と同じにしてください）
  const TOWN_LEVELS = [
    { minWords: 0,   suffix: "はらっぱ" },
    { minWords: 1,   suffix: "{村|むら}" },
    { minWords: 3,   suffix: "{町|まち}" },
    { minWords: 6,   suffix: "{市|し}" },
    { minWords: 12,  suffix: "{大都市|だいとし}" },
    { minWords: 30,  suffix: "{未来都市|みらいとし}" },
    { minWords: 100, suffix: "{世界一|せかいいち}のまち" }
  ];
  function townInfo() {
    const s = loadStore();
    const learned = Object.keys(s.words).length;
    let level = 0;
    TOWN_LEVELS.forEach((lv, i) => { if (learned >= lv.minWords) level = i; });
    return { name: s.townName || "まんまる", level };
  }
  // 例：maru町（ふりがなつき）
  function townHtml(t) {
    t = t || townInfo();
    return escapeHtml(t.name) + rich(TOWN_LEVELS[t.level].suffix);
  }
  // 左上の「戻る」：はじめの画面では まちの地図へ、問題や結果の画面では このゲームのはじめの画面へ
  function refreshBackLink(inGame) {
    const a = document.getElementById("backLink");
    if (inGame) {
      a.innerHTML = "← " + rich(D.shopName) + rich("へ{戻|もど}る");
      a.onclick = e => { e.preventDefault(); showStart(); };
    } else {
      a.innerHTML = "← " + townHtml() + rich("へ{戻|もど}る");
      a.onclick = null;
    }
  }
  let townBefore = townInfo(); // 遊ぶ前のまち（育ったかどうかをくらべるため）

  // ---- 画面の部品 ----
  // ジャンルの小さな絵と、絵＋名前
  function genreIcon(g) {
    return '<svg class="gicon g-' + g + '" aria-hidden="true" focusable="false"><use href="#gi-' + g + '"/></svg>';
  }
  function genreLabel(g) { return genreIcon(g) + rich(D.genres[g]); }

  // まちの断面図（地上と地下）。ジャンルごとの部分を押すと、そのジャンルで遊べる
  // 座標は、よこ 360 × たて 230 のマス目。地面は y=108、道路は y=113〜124、そこから下が地下
  function crossSectionSvg(s) {
    const pm = "fill:var(--pm)", pl = "fill:var(--pl)", ink = "fill:var(--ill-ink)", paper = "fill:var(--ill-paper)";
    const hit = (x, y, w, h) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="transparent"/>';
    const part = (g, body) => {
      const lit = genreEntries(g).some(e => isLearned(s, e));
      return '<g class="part g-' + g + (lit ? "" : " dim") + '" data-part="' + g + '" filter="url(#cut)" role="button" tabindex="0" aria-label="' +
        escapeHtml(plain(D.genres[g])) + 'であそぶ"><title>' + escapeHtml(plain(D.genres[g])) + "</title>" + body + "</g>";
    };
    let dashes = "";
    for (let x = 6; x < 280; x += 28) dashes += "M" + x + " 118.5h14";
    let stripes = "";
    for (let x = 287; x < 307; x += 5) stripes += '<rect x="' + x + '" y="113" width="3" height="11" style="' + paper + '" opacity=".85"/>';
    let rungs = "";
    for (let y = 130; y < 190; y += 9) rungs += "M146 " + y + "h8";

    return '<svg class="scene" viewBox="0 0 360 230" role="group" aria-label="まちの断面図">' +
      '<defs><filter id="cut" x="-5%" y="-5%" width="115%" height="120%"><feDropShadow dx="2" dy="2" stdDeviation="0" style="flood-color:var(--ill-shadow)"/></filter></defs>' +
      // 空・草・土
      '<rect width="360" height="113" style="fill:var(--ill-sky)"/>' +
      '<path d="M226 30c0-7 9-9 12-4 3-6 14-5 14 2 6 0 7 8 1 9h-25c-4 0-5-6-2-7z" style="' + paper + '"/>' +
      '<circle cx="28" cy="24" r="10" style="fill:var(--ill-roof)" opacity=".6"/>' +
      '<rect y="104" width="360" height="10" style="fill:var(--ill-grass)"/>' +
      '<rect y="124" width="360" height="106" style="fill:var(--ill-soil)"/>' +
      '<path d="M0 182q90-8 180 0t180 0V230H0z" style="fill:var(--ill-soil2)"/>' +
      // 家（どのジャンルでもない、ふつうの家）
      '<g filter="url(#cut)">' +
        '<path d="M14 108V82h34v26z" style="' + paper + '"/><path d="M10 84l21-18 21 18z" style="fill:var(--ill-roof)"/>' +
        '<path d="M26 95h8v13h-8z" style="' + ink + '"/><path d="M38 89h6v6h-6z" style="fill:var(--ill-roof2)"/>' +
        '<path d="M56 108V88h26v20z" style="' + paper + '"/><path d="M52 90l17-14 17 14z" style="fill:var(--ill-roof2)"/>' +
        '<path d="M62 94h7v7h-7z" style="fill:var(--ill-sky)"/>' +
      "</g>" +
      // 道路・橋：道路と信号機と横断歩道
      part("road",
        hit(0, 100, 360, 26) + hit(306, 60, 32, 44) +
        '<rect y="113" width="360" height="11" style="' + pm + '"/>' +
        '<path d="' + dashes + '" style="fill:none;stroke:var(--ill-paper);stroke-width:1.6"/>' + stripes +
        '<rect x="320" y="72" width="3" height="41" style="' + ink + '"/>' +
        '<rect x="309" y="64" width="25" height="10" rx="3" style="' + pm + '"/>' +
        '<circle cx="315" cy="69" r="2.6" style="' + pl + '"/><circle cx="321.5" cy="69" r="2.6" style="' + pl + '"/><circle cx="328" cy="69" r="2.6" style="' + pl + '"/>') +
      // 下水：太い下水管、マンホールとたて穴、家からの排水管
      part("sewer",
        hit(0, 186, 360, 28) + hit(138, 112, 24, 78) +
        '<rect x="22" y="108" width="4" height="84" style="' + pm + '"/>' +
        '<rect x="143" y="124" width="14" height="68" style="' + pl + '"/>' +
        '<path d="' + rungs + '" style="fill:none;stroke:var(--pm);stroke-width:1.6"/>' +
        '<rect x="0" y="190" width="360" height="20" rx="10" style="' + pm + '"/>' +
        '<rect x="0" y="198" width="360" height="5" style="' + pl + '"/>' +
        '<ellipse cx="150" cy="118.5" rx="11" ry="3.6" style="' + pm + '"/>') +
      // 水道：水道管、家への管、給水塔
      part("water",
        hit(0, 132, 360, 15) + hit(186, 50, 44, 60) +
        '<rect x="40" y="108" width="4" height="30" style="' + pm + '"/>' +
        '<rect x="207" y="76" width="4" height="62" style="' + pm + '"/>' +
        '<rect x="0" y="136" width="360" height="8" rx="4" style="' + pm + '"/>' +
        '<rect x="0" y="137.5" width="360" height="2" style="' + pl + '"/>' +
        '<path d="M196 108l6-30M222 108l-6-30M199 95h20" style="fill:none;stroke:var(--ill-ink);stroke-width:2.2"/>' +
        '<path d="M192 58q17-10 34 0v20h-34z" style="' + pm + '"/>' +
        '<rect x="192" y="64" width="34" height="3" style="' + pl + '"/>' +
        '<path d="M209 68.5c-2 3-3 4-3 5.5a3 3 0 0 0 6 0c0-1.5-1-2.5-3-5.5z" style="' + paper + '"/>') +
      // ガス：ガス管と、家へのガス管・ガスメーター
      part("gas",
        hit(0, 148, 360, 13) +
        '<rect x="68" y="100" width="3.5" height="54" style="' + pm + '"/>' +
        '<rect x="64" y="98" width="11" height="8" rx="1.5" style="' + pl + '"/>' +
        '<rect x="0" y="152" width="360" height="6" rx="3" style="' + pm + '"/>') +
      // 通信：通信ケーブル、地下のトンネル（とう道）、アンテナ（基地局）
      part("comm",
        hit(0, 162, 360, 13) + hit(236, 24, 40, 86) +
        '<rect x="254" y="108" width="2.5" height="60" style="' + pm + '"/>' +
        '<rect x="0" y="166" width="360" height="5" style="' + pm + '"/>' +
        '<path d="M4 168.5h356" style="fill:none;stroke:var(--pl);stroke-width:1.4;stroke-dasharray:6 5"/>' +
        '<circle cx="300" cy="168.5" r="9" style="fill:var(--pl);stroke:var(--pm);stroke-width:2.5"/>' +
        '<path d="M255 40l9 68h-4.5l-4.5-40-4.5 40H246z" style="' + pm + '"/>' +
        '<circle cx="255" cy="40" r="3.2" style="' + pm + '"/>' +
        '<path d="M247 34a10 10 0 0 0 0 12M263 34a10 10 0 0 1 0 12M242 30a16 16 0 0 0 0 20M268 30a16 16 0 0 1 0 20" style="fill:none;stroke:var(--pm);stroke-width:2;stroke-linecap:round"/>') +
      // 電気：電柱2本と電線、柱上変圧器
      part("power",
        hit(88, 24, 94, 86) +
        '<path d="M95 50Q130 66 165 50M114 50Q149 66 184 50M95 50Q70 60 48 76" style="fill:none;stroke:var(--pm);stroke-width:1.3"/>' +
        '<rect x="102" y="44" width="5" height="64" style="' + pm + '"/><rect x="94" y="48" width="21" height="3" style="' + ink + '"/>' +
        '<rect x="107" y="58" width="8" height="10" rx="1.5" style="' + pl + '"/>' +
        '<rect x="172" y="44" width="5" height="64" style="' + pm + '"/><rect x="164" y="48" width="21" height="3" style="' + ink + '"/>' +
        '<path d="M140 22l-5 8h4l-2 7 7-10h-4l2-5z" style="' + pm + '"/>') +
      // くらしと防災：ひなん所の旗と、備蓄の箱
      part("bousai",
        hit(278, 58, 30, 52) +
        '<rect x="282" y="64" width="2.5" height="44" style="' + ink + '"/>' +
        '<path d="M284.5 64h18l-4 6 4 6h-18z" style="' + pm + '"/>' +
        '<rect x="288" y="92" width="17" height="15" rx="2" style="fill:var(--pl);stroke:var(--pm);stroke-width:2"/>' +
        '<path d="M296.5 95v9M292 99.5h9" style="fill:none;stroke:var(--pm);stroke-width:2"/>') +
      "</svg>";
  }
  // 断面図の上に出す名前の札（x, y は断面図のマス目の位置。札のまん中がここにくる）
  const SCENE_LABELS = [
    { g: "water",  name: "{水道管|すいどうかん}",           x: 100, y: 140 },
    { g: "water",  name: "{給水塔|きゅうすいとう}",         x: 209, y: 100 },
    { g: "sewer",  name: "{下水管|げすいかん}",             x: 100, y: 200 },
    { g: "gas",    name: "ガス{管|かん}",                   x: 330, y: 155 },
    { g: "comm",   name: "{通信|つうしん}ケーブル",         x: 190, y: 168 },
    { g: "comm",   name: "アンテナ",                        x: 255, y: 13 },
    { g: "power",  name: "{電柱|でんちゅう}・{電線|でんせん}", x: 140, y: 84 },
    { g: "road",   name: "{道路|どうろ}",                   x: 180, y: 118.5 },
    { g: "bousai", name: "ひなん{所|じょ}",                 x: 296, y: 54 }
  ];
  function sceneTagsHtml(s) {
    return SCENE_LABELS.map(l => {
      const lit = genreEntries(l.g).some(e => isLearned(s, e));
      return '<span class="scene-tag g-' + l.g + (lit ? "" : " dim") + '" data-g="' + l.g + '" aria-hidden="true" style="left:' +
        (l.x / 360 * 100).toFixed(1) + "%;top:" + (l.y / 230 * 100).toFixed(1) + '%">' + rich(l.name) + "</span>";
    }).join("");
  }
  // 断面図の部分にマウスをのせた・押したときに、同じジャンルの札を目立たせる
  function highlightTags(g, on) {
    app.querySelectorAll('.scene-tag[data-g="' + g + '"]').forEach(t => t.classList.toggle("active", on));
  }
  function crossSectionHtml(s) {
    const lit = Object.keys(D.genres).filter(g => genreEntries(g).some(e => isLearned(s, e))).length;
    return '<div class="card cross"><div class="scene-wrap">' + crossSectionSvg(s) + sceneTagsHtml(s) + "</div>" +
      '<p class="caption">' + rich("ことばを{覚|おぼ}えたジャンルに{色|いろ}がつくよ（") + lit + " / " + Object.keys(D.genres).length +
      rich("）。{絵|え}を{押|お}しても{遊|あそ}べるよ。") + "</p></div>";
  }
  // 断面図の部分を押したとき：ぴょんとはねてから、そのジャンルで始める
  function setupCrossSection() {
    app.querySelectorAll(".part[data-part]").forEach(el => {
      const g = el.dataset.part;
      // 押したら、名前の札を目立たせて、ぴょんとはねてから始める（札が読めるよう、少しだけ待つ）
      const go = () => {
        if (el.classList.contains("pressing")) return;
        highlightTags(g, true);
        const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce) { setTimeout(() => startPlay(g), 400); return; }
        el.classList.add("pressing");
        setTimeout(() => startPlay(g), 650);
      };
      el.addEventListener("mouseenter", () => highlightTags(g, true));
      el.addEventListener("mouseleave", () => { if (!el.classList.contains("pressing")) highlightTags(g, false); });
      el.addEventListener("focus", () => highlightTags(g, true));
      el.addEventListener("blur", () => highlightTags(g, false));
      el.addEventListener("click", go);
      el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    });
  }

  function phraseHtml(p) {
    if (!p || !p.word) return "";
    return '<div class="phrase"><div class="label">' + (p.t ? genreIcon(p.t) : "") + "きょうのことば</div><div class=\"word\">" + rich(p.word) +
      "</div><div>" + escapeHtml(p.meaning || "") + "</div>" +
      (p.note ? '<div class="note">' + rich("💡 なるほど{解説|かいせつ}：") + escapeHtml(p.note) + "</div>" : "") +
      "</div>";
  }
  function top() { window.scrollTo(0, 0); }
  function seasonLabel(i) { return SEASON_ICONS[i] + " " + rich(SEASONS[i]); }
  // 説明の文（w2m の選択肢）にはふりがなの書き方がないので、そのまま出す
  function choiceLabelHtml(q, label) { return q.type === "w2m" ? escapeHtml(label) : rich(label); }

  // えらんだジャンルのことば（playGenre が "" のときは全部）
  function genreEntries(genre) { return genre ? STOCK.filter(e => e.t === genre) : STOCK; }
  // この回のことばをえらぶ（まだ覚えていないことばを先に出す）
  function pickEntries(rnd) {
    if (isDaily) return [STOCK[Math.floor(rnd() * STOCK.length)]];
    const s = loadStore();
    const pool = genreEntries(playGenre);
    const fresh = shuffle(pool.filter(e => !isLearned(s, e)), rnd);
    const known = shuffle(pool.filter(e => isLearned(s, e)), rnd);
    return fresh.concat(known).slice(0, D.count || 5);
  }
  function startPlay(genre) {
    if (typeof genre === "string") playGenre = genre;
    townBefore = townInfo();
    playDay = today();
    playRnd = isDaily ? seededRandom(playDay + ":" + D.gameId) : Math.random;
    playQs = pickEntries(playRnd).map(e => makeQuestion(e, playRnd));
    answers = []; newWords = []; current = 0;
    showQuestion();
  }

  // ---- はじめ ----
  function dailyIntroHtml(s) {
    const done = s.dailyDone === today();
    return "<h1>" + rich("{今日|きょう}のおつかい") + "</h1>" +
      "<p>" + rich("{今日|きょう}だけの1{問|もん}。{正解|せいかい}すると、") + townHtml() + rich("の{人口|じんこう}が") + "<b>" + (D.peopleDailyBonus || 0) + rich("{人|にん}") + "</b>" + rich("ふえるよ（1{日|にち}1{回|かい}）。") + "</p>" +
      (done ? '<p class="muted">' + rich("{今日|きょう}のおつかいは、もうやったよ。{遊|あそ}べるけれど、{人口|じんこう}はふえないよ。また{明日|あした}！") + "</p>" : "");
  }
  function normalIntroHtml(s) {
    return '<h1 class="puni">' + rich(D.title) + "</h1>" +
      "<p>" + townHtml() + rich("のくらしをささえる、") + rich(D.howToPlay) + "</p>" +
      '<p class="muted">' + rich("いまの") + townHtml() + rich("の{季節|きせつ}：") + seasonLabel(s.turn % 4) + "</p>";
  }
  // 覚えた数の表示（例：3 / 15 こ覚えた）
  function countHtml(s, genre) {
    const list = genreEntries(genre);
    return '<span class="count">' + list.filter(e => isLearned(s, e)).length + " / " + list.length + rich(" こ{覚|おぼ}えた") + "</span>";
  }
  // ジャンルえらびのボタン（いちばん上は「ぜんぶのジャンル」）
  function genreButtonsHtml(s) {
    return '<h2>' + rich("ジャンルをえらんでね") + "</h2>" +
      '<button class="btn primary" type="button" data-genre="">' + rich("ぜんぶのジャンル") + countHtml(s, "") + "</button>" +
      '<div class="genre-list">' +
        Object.keys(D.genres).map(g =>
          '<button class="btn g g-' + g + '" type="button" data-genre="' + g + '">' + genreLabel(g) + countHtml(s, g) + "</button>"
        ).join("") +
      "</div>";
  }
  function showStart() {
    document.title = plain(D.title);
    const s = loadStore();
    const info = isDaily ? dailyIntroHtml(s) : normalIntroHtml(s);
    refreshBackLink();
    app.innerHTML =
      '<div class="card"><p class="muted">' + townHtml() + " " + rich(D.shopName || "") + "</p>" + info + "</div>" +
      (isDaily ? '<button class="btn primary" id="startBtn" type="button">はじめる</button>' : crossSectionHtml(s) + genreButtonsHtml(s));
    if (isDaily) document.getElementById("startBtn").onclick = () => startPlay("");
    app.querySelectorAll("[data-genre]").forEach(btn => { btn.onclick = () => startPlay(btn.dataset.genre); });
    if (!isDaily) setupCrossSection();
    top();
  }

  // ---- 問題 ----
  function isLastQuestion() { return current === playQs.length - 1; }
  function progressPercent(done) { return done / playQs.length * 100; }
  function questionHtml(q, choices) {
    return '<div class="progress-text">' + rich((current + 1) + " / " + playQs.length + " {問目|もんめ}") + "</div>" +
      '<div class="progress"><div style="width:' + progressPercent(current) + '%"></div></div>' +
      '<div class="card g g-' + q.entry.t + '">' +
        '<div class="industry g g-' + q.entry.t + '">' + genreIcon(q.entry.t) + rich(q.heading) + "</div>" +
        (q.hard ? ' <div class="hard">' + rich("★むずかしい") + "</div>" : "") +
        q.promptHtml +
      "</div>" +
      '<div id="choices">' +
        choices.map((c, i) => '<button class="btn" type="button" data-i="' + i + '">' + choiceLabelHtml(q, c.label) + "</button>").join("") +
      "</div>" +
      '<div id="feedback"></div>';
  }
  function feedbackHtml(q, chosen) {
    const right = q.choices.find(c => c.points === 3);
    const fb = D.feedback || {};
    return '<div class="card">' +
        '<p class="feedback p' + chosen.points + '">' + rich(fb[chosen.points] || chosen.points + "点") + "</p>" +
        (chosen.points !== 3 ? "<p><b>" + rich("{正解|せいかい}：") + "</b>" + choiceLabelHtml(q, right.label) + "</p>" : "") +
        phraseHtml(q.phrase) +
      "</div>" +
      '<button class="btn primary" id="nextBtn" type="button">' + rich(isLastQuestion() ? "{結果|けっか}を{見|み}る" : "つぎへ") + "</button>";
  }
  function goNext() {
    if (isLastQuestion()) { showResult(); } else { current++; showQuestion(); }
  }
  function choose(q, chosen, btn) {
    answers[current] = chosen;
    if (chosen.points === 3) learnWord(q.entry);
    app.querySelectorAll("#choices .btn").forEach(b => { b.disabled = true; });
    btn.classList.add("chosen");
    app.querySelector(".progress > div").style.width = progressPercent(current + 1) + "%";
    document.getElementById("feedback").innerHTML = feedbackHtml(q, chosen);
    const next = document.getElementById("nextBtn");
    next.onclick = goNext;
    next.scrollIntoView({ behavior: "smooth", block: "end" });
  }
  function showQuestion() {
    const q = playQs[current];
    const choices = shuffle(q.choices, playRnd);
    refreshBackLink(true);
    app.innerHTML = questionHtml(q, choices);
    app.querySelectorAll("#choices .btn").forEach(btn => {
      btn.onclick = () => choose(q, choices[Number(btn.dataset.i)], btn);
    });
    top();
  }

  // ---- まちの記録を進める（人口・季節・今日のおつかい） ----
  function peopleAddedNews(n) {
    return townHtml(townBefore) + rich("の{人口|じんこう}が") + "<b>" + n + "</b>" + rich("{人|にん}ふえた！");
  }
  function updateDailyTown(s, correctCount) {
    const firstToday = s.dailyDone !== playDay;
    s.dailyDone = playDay;
    if (firstToday && correctCount > 0) {
      s.people += D.peopleDailyBonus || 0;
      return [peopleAddedNews(D.peopleDailyBonus || 0)];
    }
    if (!firstToday) return [rich("{今日|きょう}のおつかいは2{回目|かいめ}なので、{人口|じんこう}はふえないよ。")];
    return [];
  }
  function updatePlayTown(s, correctCount) {
    const news = [];
    const add = correctCount * (D.peoplePerCorrect || 0);
    s.people += add;
    if (add > 0) news.push(peopleAddedNews(add));
    s.turn += 1;
    news.push(townHtml(townBefore) + rich("の{季節|きせつ}が") + " " + seasonLabel(s.turn % 4) + " " + rich("になった。"));
    return news;
  }
  function updateTown(correctCount) {
    const s = loadStore();
    const news = isDaily ? updateDailyTown(s, correctCount) : updatePlayTown(s, correctCount);
    news.push(rich("いまの{人口|じんこう}：") + "<b>" + s.people.toLocaleString("ja-JP") + "</b>" + rich("{人|にん}"));
    saveStore(s);
    // ことばを覚えて、まちが育ったとき
    const townAfter = townInfo();
    if (townAfter.level > townBefore.level) {
      news.push("<b>" + rich("🎉 まちが「") + townHtml(townAfter) + rich("」に{育|そだ}った！") + "</b> " + rich("まちの{地図|ちず}で{見|み}てみよう。"));
    }
    return news;
  }

  // ---- 結果 ----
  function resultMessage(total) {
    const msg = D.results.slice().sort((a, b) => b.minPoints - a.minPoints).find(r => total >= r.minPoints);
    return msg ? msg.message : "";
  }
  function scoreCardHtml(total) {
    return '<div class="card" style="text-align:center">' +
        '<p class="muted">' + rich("{結果|けっか}") + "</p>" +
        '<p class="score">' + total + " / " + playQs.length * 3 + rich("{点|てん}") + "</p>" +
        (isDaily ? "" : "<h2>" + rich(resultMessage(total)) + "</h2>") +
      "</div>";
  }
  function townNewsHtml(news) {
    return '<div class="card town-news"><h2>' + rich("まちのニュース") + "</h2>" + news.map(n => "<p>" + n + "</p>").join("") + "</div>";
  }
  function newWordsHtml() {
    if (!newWords.length) return "";
    return '<div class="card"><h2>' + rich("{新|あたら}しく{覚|おぼ}えたことば") + "</h2>" + newWords.map(phraseHtml).join("") + "</div>";
  }
  function recapHtml(q, i) {
    const c = answers[i];
    return '<div class="card recap">' +
        "<h3>" + (i + 1) + ". " + rich(q.entry.w) + ' <b class="p' + c.points + '">（' + c.points + rich("{点|てん}") + "）</b></h3>" +
        '<p class="muted">' + escapeHtml(q.entry.m) + "</p>" +
      "</div>";
  }
  function resultButtonsHtml() {
    const genreName = playGenre ? D.genres[playGenre] : "ぜんぶのジャンル";
    return (isDaily ? "" :
        '<button class="btn primary" id="againBtn" type="button">' + rich("もう{一度|いちど}あそぶ（" + genreName + "）") + "</button>" +
        '<button class="btn secondary" id="chooseBtn" type="button">' + rich("ジャンルをえらびなおす") + "</button>") +
      '<a class="btn secondary" href="index.html" style="text-decoration:none">' + townHtml() + rich("へ{戻|もど}る（{地図|ちず}）") + "</a>";
  }
  function showResult() {
    const total = answers.reduce((s, c) => s + c.points, 0);
    const correct = answers.filter(c => c.points === 3).length;
    const news = updateTown(correct);
    refreshBackLink(true);
    app.innerHTML =
      scoreCardHtml(total) +
      townNewsHtml(news) +
      newWordsHtml() +
      playQs.map(recapHtml).join("") +
      resultButtonsHtml();
    if (!isDaily) {
      document.getElementById("againBtn").onclick = () => startPlay(playGenre);
      document.getElementById("chooseBtn").onclick = showStart;
    }
    top();
  }

  // 自動チェック用（画面には関係しない）
  window.__infra = { STOCK, makeQuestion, checkData, plain, seededRandom };

  showStart();
})();
</script>
</body>
</html>
